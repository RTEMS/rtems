actions:
- action: remove-tree
  enabled-by: true
  missing-ok: true
  path: ${.:/params/build-directory}
- action: remove-glob
  enabled-by: true
  path: ${../source/sis:/directory}
  patterns:
  - .lock-waf*
  - .waf*
  remove-tree: true
- action: subprocess
  command:
  - ./waf
  - configure
  - --out=${.:/params/build-directory}
  - --prefix=${.:/component/deployment-directory}
  enabled-by: true
  env: []
  expected-return-code: 0
  working-directory: ${../source/sis:/directory}
- action: subprocess
  command:
  - ./waf
  - build
  - -j
  - ${.:/host-processor-count}
  enabled-by: true
  env: []
  expected-return-code: 0
  working-directory: ${../source/sis:/directory}
- action: subprocess
  command:
  - ./waf
  - install
  - --destdir=${.:/params/build-directory}/destdir
  enabled-by: true
  env: []
  expected-return-code: 0
  working-directory: ${../source/sis:/directory}
- action: directory-state-discard-and-clear
  enabled-by: true
  output-name: .
- action: directory-state-move-tree
  enabled-by: true
  excludes: []
  output-name: .
  prefix: null
  root: ${.:/params/build-directory}/destdir/${.:/component/deployment-directory}
- action: subprocess
  command:
  - strip
  - -s
  - ${.:/glob-executables:*/bin/*}
  enabled-by: true
  env: []
  expected-return-code: null
  working-directory: ${.:/params/build-directory}
- action: remove-glob
  enabled-by: true
  path: ${../source/sis:/directory}
  patterns:
  - .lock-waf*
  - .waf*
  remove-tree: true
- action: remove-tree
  enabled-by: true
  missing-ok: true
  path: ${.:/params/build-directory}
copyrights:
- Copyright (C) 2023 embedded brains GmbH & Co. KG
directory: ${.:/component/deployment-directory}
directory-state-type: explicit
enabled-by:
- pkg.arch.riscv
- pkg.arch.sparc
files: []
hash: null
license-info: []
links:
- hash: null
  name: component
  role: input
  uid: ../component
- hash: null
  name: source
  role: input
  uid: ../source/sis
- hash: null
  name: member
  role: input-to
  uid: archive
params:
  build-directory: ${.:/component/build-directory}/build-sis
pkg-type: directory-state
type: pkg

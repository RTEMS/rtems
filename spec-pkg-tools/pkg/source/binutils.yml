archive-file: ${.:/component/workspace-directory}/src/binutils-2.46.1.tar.xz
archive-hash: pcZeVuQA7T-4kGqZXbuT61vqVLFjRCRGU9f0TvKc62AnDaJjsZ0lMCw3dZeE4U_LS5Qhsp4OLH9FC9mfa7RZXA==
archive-patches:
- enabled-by: true
  patch: |
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>
    Date: Mon, 1 Sep 2026 09:00:00 +0200
    Subject: bfd/microblaze: Relax a section once

    The relaxation pass of the MicroBlaze linker deletes the imm word of a
    branch pair where the distance fits in 16 bits.  The MicroBlaze
    compiler passes -relax on every link.  The pass runs again after each
    placement of the sections.  A placement moves the two ends apart again
    where the alignment of a section between them takes more bytes.  The
    pass cannot restore the word.  The RTEMS test ts-validation-acfg-0 got
    a branch 205 bytes out of range.

    Take the decisions of a section on the first placement alone.

    Assisted-by: Claude:claude-opus-5 claude-code
    Signed-off-by: Sebastian Huber <sebastian.huber@embedded-brains.de>
    ---
    --- a/bfd/elf32-microblaze.c
    +++ b/bfd/elf32-microblaze.c
    @@ -734,6 +734,8 @@
       size_t relax_count;
       /* Relaxation table.  */
       struct relax_table *relax;
    +  /* True after the first relaxation of this section.  */
    +  bool relax_done;
     };

     #define microblaze_elf_section_data(sec) \
    @@ -1788,6 +1790,16 @@
           || (sdata = microblaze_elf_section_data (sec)) == NULL)
         return true;

    +  /* The pass cannot restore an instruction which an earlier call deleted.
    +     The link places the sections again after each call, so a later call
    +     sees other distances.  A distance grows again where the alignment of
    +     a section between the two ends takes more bytes.  Take the decisions
    +     of a section once, on the placement which the link makes before the
    +     first call.  */
    +  if (sdata->relax_done)
    +    return true;
    +  sdata->relax_done = true;
    +
       BFD_ASSERT ((sec->size > 0) || (sec->rawsize > 0));

       /* If this is the first time we have been called for this section,
  type: inline

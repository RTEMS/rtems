  patch: "From 5e37a378e2391fa4254ba45b23dfb1baef32ad7f Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Sat, 3 Oct 2026\
    \ 09:39:55 +0200\nSubject: [PATCH 2/3] rtemstoolkit/rap: Align objects to all\
    \ sections\n\nThe layout aligned the start of an object in a RAP section to the\n\
    alignment of its first input section.  This is often an empty .text\nsection with\
    \ an alignment of one.  The offsets of the other input\nsections were aligned\
    \ relative to the object start.  The writer padded\neach input section to its\
    \ alignment relative to the RAP section start.\nOn i386 the code of a function\
    \ thus lay two bytes after the address of\nits symbol and the targets of its relocations.\
    \  The alignment of a RAP\nsection was the one of the last object.\n\nAlign an\
    \ object to the largest alignment of its input sections, in the\nlayout and in\
    \ the writer.  Its relative and its absolute offsets then\nagree.  Give a RAP\
    \ section the largest alignment of all objects.\n\nAssisted-by: Claude:claude-opus-5-5\
    \ claude-code\nSigned-off-by: Sebastian Huber <sebastian.huber@embedded-brains.de>\n\
    ---\n rtemstoolkit/rld-rap.cpp | 48 +++++++++++++++++++++++++++++-----------\n\
    \ 1 file changed, 35 insertions(+), 13 deletions(-)\n\ndiff --git a/rtemstoolkit/rld-rap.cpp\
    \ b/rtemstoolkit/rld-rap.cpp\nindex 82bef94..4537d27 100644\n--- a/rtemstoolkit/rld-rap.cpp\n\
    +++ b/rtemstoolkit/rld-rap.cpp\n@@ -205,7 +205,7 @@ namespace rld\n       uint32_t\
    \ size (uint32_t offset = 0) const;\n \n       /**\n-       * The alignment of\
    \ the first section.\n+       * The largest alignment of the sections.\n     \
    \   */\n       uint32_t alignment () const;\n \n@@ -594,12 +594,14 @@ namespace\
    \ rld\n     uint32_t\n     section::alignment () const\n     {\n-      if (!osindexes.empty\
    \ ())\n+      uint32_t align = 0;\n+      for (size_t si = 0; si < osindexes.size\
    \ (); ++si)\n       {\n-        const osection& osec = get_osection (osindexes[0]);\n\
    -        return osec.align;\n+        const osection& osec = get_osection (osindexes[si]);\n\
    +        if (osec.align > align)\n+          align = osec.align;\n       }\n-\
    \      return 0;\n+      return align;\n     }\n \n     uint32_t\n@@ -1010,7 +1012,8\
    \ @@ namespace rld\n           {\n             obj.secs[s].set_offset (pobj.secs[s]);\n\
    \             sec_size[s] = obj.secs[s].offset + obj.secs[s].size ();\n-     \
    \       sec_align[s] = obj.secs[s].alignment ();\n+            if (obj.secs[s].alignment\
    \ () > sec_align[s])\n+              sec_align[s] = obj.secs[s].alignment ();\n\
    \             if (obj.secs[s].rela == true)\n               sec_rela[s] = obj.secs[s].rela;\n\
    \           }\n@@ -1276,6 +1279,14 @@ namespace rld\n       }\n     }\n \n+  \
    \  static void\n+    write_padding (compress::compressor& comp, uint32_t size)\n\
    +    {\n+      char ee = '\\xee';\n+      for (uint32_t p = 0; p < size; ++p)\n\
    +        comp.write (&ee, 1);\n+    }\n+\n     void\n     image::write (compress::compressor&\
    \  comp,\n                   files::object&         obj,\n@@ -1283,6 +1294,7 @@\
    \ namespace rld\n                   uint32_t&              offset)\n     {\n \
    \      uint32_t size = 0;\n+      uint32_t align = 0;\n \n       obj.open ();\n\
    \ \n@@ -1293,6 +1305,22 @@ namespace rld\n         if (rld::verbose () >= RLD_VERBOSE_FULL_DEBUG)\n\
    \           std::cout << \"rap:write sections: \" << obj.name ().full () << std::endl;\n\
    \ \n+        /*\n+         * The layout aligns the object to the largest alignment\
    \ of its\n+         * sections.\n+         */\n+        for (files::sections::const_iterator\
    \ si = secs.begin ();\n+             si != secs.end ();\n+             ++si)\n\
    +        {\n+          if (si->alignment > align)\n+            align = si->alignment;\n\
    +        }\n+\n+        uint32_t unaligned_start = offset;\n+        offset =\
    \ align_offset (offset, 0, align);\n+        write_padding (comp, offset - unaligned_start);\n\
    +\n         for (files::sections::const_iterator si = secs.begin ();\n       \
    \       si != secs.end ();\n              ++si)\n@@ -1301,13 +1329,7 @@ namespace\
    \ rld\n           uint32_t              unaligned_offset = offset + size;\n \n\
    \           offset = align_offset (offset, size, sec.alignment);\n-\n-       \
    \   if (offset != unaligned_offset)\n-          {\n-            char ee = '\\\
    xee';\n-            for (uint32_t p = 0; p < (offset - unaligned_offset); ++p)\n\
    -              comp.write (&ee, 1);\n-          }\n+          write_padding (comp,\
    \ offset - unaligned_offset);\n \n           comp.write (obj, sec.offset, sec.size);\n\
    \ \n-- \n2.53.0\n\n"
  type: inline

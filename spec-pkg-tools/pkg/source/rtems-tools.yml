  patch: "From 30e75ea748245871ff20902ea7dbf9ce62b79828 Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Sat, 3 Oct 2026\
    \ 09:39:38 +0200\nSubject: [PATCH 1/3] rtemstoolkit/rap: Relocate undefined symbols\n\
    \nThe RAP writer skipped every relocation record whose symbol has the\nsection\
    \ index 0.  This index marks the null symbol, and also every\nundefined symbol.\
    \  The loader resolves an undefined symbol by its name,\nso a call from the RAP\
    \ file into the base image stayed unrelocated.\nThe header of each section still\
    \ counted the skipped records.  The\nloader thus read past the last record and\
    \ reported \"offset past end of\nfile\" or a symbol with a garbage name.\n\nDrop\
    \ a relocation of the null symbol when the layout collects the\nrecords, so that\
    \ the count in the header matches the records written.\nA relocation against an\
    \ undefined symbol has a name and stays.\n\nAssisted-by: Claude:claude-opus-5-5\
    \ claude-code\nSigned-off-by: Sebastian Huber <sebastian.huber@embedded-brains.de>\n\
    ---\n rtemstoolkit/rld-rap.cpp | 11 +++++++----\n 1 file changed, 7 insertions(+),\
    \ 4 deletions(-)\n\ndiff --git a/rtemstoolkit/rld-rap.cpp b/rtemstoolkit/rld-rap.cpp\n\
    index 045536a..82bef94 100644\n--- a/rtemstoolkit/rld-rap.cpp\n+++ b/rtemstoolkit/rld-rap.cpp\n\
    @@ -777,7 +777,13 @@ namespace rld\n            ++fri, ++rc)\n       {\n     \
    \    const files::relocation& freloc = *fri;\n-        bool                  \
    \   merge_reloc = machine_relocation_check (freloc);\n+\n+        /*\n+      \
    \   * A relocation without a symbol references the null symbol.  The\n+      \
    \   * null symbol has no section and no name.\n+         */\n+        bool merge_reloc\
    \ = (freloc.symsect != 0 || !freloc.symname.empty ()) &&\n+          machine_relocation_check\
    \ (freloc);\n \n         if (rld::verbose () >= RLD_VERBOSE_FULL_DEBUG)\n    \
    \       std::cout << \" \" << std::setw (2) << sec.relocs.size ()\n@@ -1406,9\
    \ +1412,6 @@ namespace rld\n             bool              write_addend = sec.rela;\n\
    \             bool              write_symname = false;\n \n-            if (reloc.symsect\
    \ == 0)\n-              continue;\n-\n             offset = sec.offset + reloc.offset;\n\
    \ \n             if (rld::verbose () >= RLD_VERBOSE_TRACE)\n-- \n2.53.0\n\n"

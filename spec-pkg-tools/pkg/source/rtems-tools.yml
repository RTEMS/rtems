  patch: "From 83f3d8b66813c6ad6ddefd17197875c61fab0c6e Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Sat, 3 Oct 2026\
    \ 06:07:47 +0200\nSubject: [PATCH] rtemstoolkit/elf: Ignore unused undefined symbols\n\
    \nThe assembler of i386 and microblaze adds _GLOBAL_OFFSET_TABLE_ as an\nundefined\
    \ symbol to an object which uses a thread-local storage\noperator.  No relocation\
    \ record references the symbol.  rtems-ld\ntreated it as unresolved and stopped\
    \ with \"symbol not found:\n_GLOBAL_OFFSET_TABLE_\".  A Newlib built with\n--enable-newlib-reent-thread-local\
    \ carries such objects, so no\napplication which links them could become a RAP\
    \ file.\n\nReport an undefined symbol as unresolved only if a relocation record\n\
    references it.\n\nAssisted-by: Claude:claude-opus-5-5 claude-code\nSigned-off-by:\
    \ Sebastian Huber <sebastian.huber@embedded-brains.de>\n---\n rtemstoolkit/rld-elf.cpp\
    \ | 51 +++++++++++++++++++++++++++++++++++++++-\n rtemstoolkit/rld-elf.h   | \
    \ 9 +++++++\n 2 files changed, 59 insertions(+), 1 deletion(-)\n\ndiff --git a/rtemstoolkit/rld-elf.cpp\
    \ b/rtemstoolkit/rld-elf.cpp\nindex b8b5688..7635697 100644\n--- a/rtemstoolkit/rld-elf.cpp\n\
    +++ b/rtemstoolkit/rld-elf.cpp\n@@ -848,6 +848,11 @@ namespace rld\n \n      \
    \ load_symbols ();\n \n+      std::set<int> relocation_syms;\n+\n+      if (unresolved)\n\
    +        get_relocation_symbols (relocation_syms);\n+\n       filtered_syms.clear\
    \ ();\n \n       for (symbols::bucket::iterator si = symbols.begin ();\n@@ -872,7\
    \ +877,12 @@ namespace rld\n             (sbind == STB_GLOBAL) &&\n          \
    \   (sym.section_index () == SHN_UNDEF))\n         {\n-          if (unresolved)\n\
    +          /*\n+           * An undefined symbol which no relocation record references\
    \ needs\n+           * no definition. The assembler adds _GLOBAL_OFFSET_TABLE_\
    \ to an\n+           * object which uses a thread-local storage operator, for\
    \ example.\n+           */\n+          if (unresolved && relocation_syms.count\
    \ (sym.index ()) != 0)\n             add = true;\n         }\n         else\n\
    @@ -908,6 +918,45 @@ namespace rld\n                         \"elf:file:get_symbol:\
    \ \" + name_);\n     }\n \n+    void\n+    file::get_relocation_symbols (std::set<int>&\
    \ indices)\n+    {\n+      sections rel_secs;\n+\n+      get_sections (rel_secs,\
    \ SHT_REL);\n+      get_sections (rel_secs, SHT_RELA);\n+\n+      for (sections::iterator\
    \ si = rel_secs.begin ();\n+           si != rel_secs.end ();\n+           ++si)\n\
    +      {\n+        section& sec = *(*si);\n+        int      rels = sec.entries\
    \ ();\n+\n+        for (int r = 0; r < rels; ++r)\n+        {\n+          if (sec.type\
    \ () == SHT_RELA)\n+          {\n+            elf_rela erela;\n+\n+          \
    \  if (!::gelf_getrela (sec.data (), r, &erela))\n+              error (\"gelf_getrela\"\
    );\n+\n+            indices.insert (GELF_R_SYM (erela.r_info));\n+          }\n\
    +          else\n+          {\n+            elf_rel erel;\n+\n+            if\
    \ (!::gelf_getrel (sec.data (), r, &erel))\n+              error (\"gelf_getrel\"\
    );\n+\n+            indices.insert (GELF_R_SYM (erel.r_info));\n+          }\n\
    +        }\n+      }\n+    }\n+\n     void\n     file::load_relocations ()\n \
    \    {\ndiff --git a/rtemstoolkit/rld-elf.h b/rtemstoolkit/rld-elf.h\nindex d66eee5..fae5707\
    \ 100644\n--- a/rtemstoolkit/rld-elf.h\n+++ b/rtemstoolkit/rld-elf.h\n@@ -27,6\
    \ +27,7 @@\n \n #include <list>\n #include <map>\n+#include <set>\n #include <vector>\n\
    \ \n #include <rld.h>\n@@ -705,6 +706,14 @@ namespace rld\n        */\n      \
    \ void check_phdr (const char* where) const;\n \n+      /**\n+       * Get the\
    \ indices of the symbols which the relocation records\n+       * reference.\n\
    +       *\n+       * @param indices The symbol indices found in the file.\n+ \
    \      */\n+      void get_relocation_symbols (std::set<int>& indices);\n+\n \
    \      /**\n        * Generate libelf error.\n        *\n-- \n2.53.0\n\n"

  patch: "From 98cd8d4b743aa74a395d2b289650824c4f1e7621 Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Sat, 3 Oct 2026\
    \ 09:40:06 +0200\nSubject: [PATCH 3/3] rap: Write the relocation type as a word\n\
    \nA relocation record of a RAP file held the ELF relocation type in bits\n7:0\
    \ of its info word.  The AArch64 types start at 257, so an AArch64\nRAP file carried\
    \ wrong types and wrong symbol names.\n\nIntroduce version 3 of the format.  It\
    \ writes the type as a word after\nthe info word and leaves bits 7:0 of the info\
    \ word clear.  rtems-rap\nreads both versions.\n\nAssisted-by: Claude:claude-opus-5-5\
    \ claude-code\nSigned-off-by: Sebastian Huber <sebastian.huber@embedded-brains.de>\n\
    ---\n linkers/rtems-rapper.cpp | 25 ++++++++++++++++++-------\n rtemstoolkit/rld-rap.cpp\
    \ | 10 +++++++---\n rtemstoolkit/rld-rap.h   |  7 +++++++\n 3 files changed, 32\
    \ insertions(+), 10 deletions(-)\n\ndiff --git a/linkers/rtems-rapper.cpp b/linkers/rtems-rapper.cpp\n\
    index ca239b4..0d3b49d 100644\n--- a/linkers/rtems-rapper.cpp\n+++ b/linkers/rtems-rapper.cpp\n\
    @@ -76,6 +76,7 @@ namespace rap\n   struct relocation\n   {\n     uint32_t   \
    \ info;\n+    uint32_t    type;\n     uint32_t    offset;\n     uint32_t    addend;\n\
    \     std::string symname;\n@@ -118,7 +119,7 @@ namespace rap\n     ~section ();\n\
    \ \n     void load_data (rld::compress::compressor& comp);\n-    void load_relocs\
    \ (rld::compress::compressor& comp);\n+    void load_relocs (rld::compress::compressor&\
    \ comp, uint32_t version);\n   };\n \n   /**\n@@ -282,6 +283,7 @@ namespace rap\n\
    \ \n   relocation::relocation ()\n     : info (0),\n+      type (0),\n       offset\
    \ (0),\n       addend (0),\n       rap_off (0)\n@@ -293,6 +295,9 @@ namespace\
    \ rap\n   {\n     std::cout << std::hex << std::setfill ('0')\n              \
    \ << \"0x\" << std::setw (8) << info\n+              << std::dec << std::setfill\
    \ (' ')\n+              << \" \" << std::setw (4) << type\n+              << std::hex\
    \ << std::setfill ('0')\n               << \" 0x\" << std::setw (8) << offset\n\
    \               << \" 0x\" << std::setw(8) << addend\n               << std::dec\
    \ << std::setfill (' ')\n@@ -329,7 +334,7 @@ namespace rap\n   }\n \n   void\n\
    -  section::load_relocs (rld::compress::compressor& comp)\n+  section::load_relocs\
    \ (rld::compress::compressor& comp, uint32_t version)\n   {\n     uint32_t header;\n\
    \     comp >> header;\n@@ -345,8 +350,14 @@ namespace rap\n \n         reloc.rap_off\
    \ = comp.offset ();\n \n-        comp >> reloc.info\n-             >> reloc.offset;\n\
    +        comp >> reloc.info;\n+\n+        if (version >= 3)\n+          comp >>\
    \ reloc.type;\n+        else\n+          reloc.type = reloc.info & 0xff;\n+\n\
    +        comp >> reloc.offset;\n \n         if (((reloc.info & RAP_RELOC_STRING)\
    \ == 0) || rela)\n           comp >> reloc.addend;\n@@ -632,7 +643,7 @@ namespace\
    \ rap\n      */\n     relocs_rap_off = comp.offset ();\n     for (int s = 0; s\
    \ < rld::rap::rap_secs; ++s)\n-      secs[s].load_relocs (comp);\n+      secs[s].load_relocs\
    \ (comp, rhdr_version);\n   }\n \n   void\n@@ -944,7 +955,7 @@ rap_show (rld::path::paths&\
    \ raps,\n         {\n           const char* rela = r.secs[s].rela ? \"(A)\" :\
    \ \"   \";\n           std::cout << std::setw (16) << r.secs[s].name\n-      \
    \              << \": info       offset     addend \"\n+                    <<\
    \ \": info       type offset     addend \"\n                     << rela\n   \
    \                  << \" symbol name\" << std::endl;\n           for (size_t f\
    \ = 0; f < r.secs[s].relocs.size (); ++f)\n@@ -1035,7 +1046,7 @@ rap_overlay (rld::path::paths&\
    \ raps, bool warnings)\n         if (sec.relocs.size ())\n         {\n       \
    \    int count = 0;\n-          std::cout << \"     info       offset     addend\
    \     symbol name\" << std::endl;\n+          std::cout << \"     info       type\
    \ offset     addend     symbol name\" << std::endl;\n           for (size_t f\
    \ = 0; f < r.secs[s].relocs.size (); ++f)\n           {\n             rap::relocation&\
    \ reloc = r.secs[s].relocs[f];\ndiff --git a/rtemstoolkit/rld-rap.cpp b/rtemstoolkit/rld-rap.cpp\n\
    index 4537d27..b613392 100644\n--- a/rtemstoolkit/rld-rap.cpp\n+++ b/rtemstoolkit/rld-rap.cpp\n\
    @@ -1428,7 +1428,8 @@ namespace rld\n                ++ri)\n           {\n   \
    \          const relocation& reloc = *ri;\n-            uint32_t          info\
    \ = GELF_R_TYPE (reloc.info);\n+            uint32_t          type = GELF_R_TYPE\
    \ (reloc.info);\n+            uint32_t          info = 0;\n             uint32_t\
    \          offset;\n             uint32_t          addend = reloc.addend;\n  \
    \           bool              write_addend = sec.rela;\n@@ -1510,6 +1511,7 @@\
    \ namespace rld\n               std::cout << \"  \" << std::setw (2) << sr <<\
    \ '/'\n                         << std::setw (2) << rc\n                     \
    \    << std::hex << \": reloc: info=0x\" << info << std::dec\n+              \
    \          << \" type=\" << type\n                         << \" offset=\" <<\
    \ offset;\n               if (write_addend)\n                 std::cout << \"\
    \ addend=\" << addend;\n@@ -1526,7 +1528,7 @@ namespace rld\n                \
    \         << std::endl;\n             }\n \n-            comp << info << offset;\n\
    +            comp << info << type << offset;\n \n             if (write_addend)\n\
    \               comp << addend;\n@@ -1727,7 +1729,9 @@ namespace rld\n     {\n\
    \       std::string header;\n \n-      header = \"RAP,00000000,0002,LZ77,00000000\\\
    n\";\n+      std::ostringstream version;\n+      version << std::setfill ('0')\
    \ << std::setw (4) << RAP_VERSION;\n+      header = \"RAP,00000000,\" + version.str\
    \ () + \",LZ77,00000000\\n\";\n       app.write (header.c_str (), header.size\
    \ ());\n \n       compress::compressor compressor (app, 2 * 1024);\ndiff --git\
    \ a/rtemstoolkit/rld-rap.h b/rtemstoolkit/rld-rap.h\nindex 19969e3..7209232 100644\n\
    --- a/rtemstoolkit/rld-rap.h\n+++ b/rtemstoolkit/rld-rap.h\n@@ -41,6 +41,13 @@\
    \ namespace rld\n       */\n      extern std::string rpath;\n \n+    /**\n+  \
    \   * The RAP file format version.  Version 3 adds the ELF relocation type as\n\
    +     * a word of its own after the info word of a relocation record.  Version\
    \ 2\n+     * holds the type in bits 7:0 of the info word.\n+     */\n+    #define\
    \ RAP_VERSION 3\n+\n     /**\n      * The RAP relocation bit masks.\n      */\n\
    -- \n2.53.0\n\n"

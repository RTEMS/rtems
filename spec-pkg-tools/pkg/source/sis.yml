  patch: "From 54a75c54cce1206a87a85a3b02485fd49d43eaff Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Tue, 29 Sep\
    \ 2026 03:01:21 +0200\nSubject: [PATCH] sis: Support eight processors\n\nThe GR765\
    \ has eight processor cores.  SIS supported at most four.  The\nIRQ(A)MP emulation\
    \ decoded the mask, force and extended acknowledge\nregisters of each of the four\
    \ processors in a case of its own.\n\nRaise NCPU to eight.  Decode the per-processor\
    \ registers of the\nIRQ(A)MP by address range.\n\nAssisted-by: Claude:claude-opus-5-5\
    \ claude-code\nSigned-off-by: Sebastian Huber <sebastian.huber@embedded-brains.de>\n\
    ---\n grlib.c  | 117 +++++++++----------------------------------------------\n\
    \ help.c   |   2 +-\n sis.h    |   2 +-\n sis.texi |   8 ++--\n 4 files changed,\
    \ 24 insertions(+), 105 deletions(-)\n\ndiff --git a/grlib.c b/grlib.c\nindex\
    \ 01c8a37..3ba06e6 100644\n--- a/grlib.c\n+++ b/grlib.c\n@@ -394,17 +394,8 @@\
    \ const struct grlib_ipcore apbmst = {\n #define IRQMP_ISR \t0x10\n #define IRQMP_IBR\
    \ \t0x14\n #define IRQMP_IMR \t0x40\n-#define IRQMP_IMR1\t0x44\n-#define IRQMP_IMR2\t\
    0x48\n-#define IRQMP_IMR3\t0x4C\n #define IRQMP_IFR0 \t0x80\n-#define IRQMP_IFR1\
    \ \t0x84\n-#define IRQMP_IFR2 \t0x88\n-#define IRQMP_IFR3 \t0x8C\n #define IRQMP_PEXTACK0\
    \ \t0xC0\n-#define IRQMP_PEXTACK1 \t0xC4\n-#define IRQMP_PEXTACK2 \t0xC8\n-#define\
    \ IRQMP_PEXTACK3 \t0xCC\n #define IRQMP_IRQMAP\t0x300\n #define IRQMP_BUS_LINE_MAX\
    \ 64\n \n@@ -592,56 +583,14 @@ irqmp_read (uint32 addr, uint32 * data)\n     \
    \  *data = irqmp_ibr;\n       break;\n \n-    case IRQMP_IMR:\t\t/* 0x40 */\n\
    -      *data = irqmp_imr[0];\n-      break;\n-\n-    case IRQMP_IMR1:\t\t/* 0x44\
    \ */\n-      *data = irqmp_imr[1];\n-      break;\n-\n-    case IRQMP_IMR2:\t\t\
    /* 0x48 */\n-      *data = irqmp_imr[2];\n-      break;\n-\n-    case IRQMP_IMR3:\t\
    \t/* 0x4C */\n-      *data = irqmp_imr[3];\n-      break;\n-\n-    case IRQMP_IFR0:\t\
    \t/* 0x80 */\n-      *data = irqmp_ifr[0];\n-      break;\n-\n-    case IRQMP_IFR1:\t\
    \t/* 0x84 */\n-      *data = irqmp_ifr[1];\n-      break;\n-\n-    case IRQMP_IFR2:\t\
    \t/* 0x88 */\n-      *data = irqmp_ifr[2];\n-      break;\n-\n-    case IRQMP_IFR3:\t\
    \t/* 0x8C */\n-      *data = irqmp_ifr[3];\n-      break;\n-\n-    case IRQMP_PEXTACK0:\t\
    /* 0xC0 */\n-      *data = irqmp_pextack[0];\n-      break;\n-\n-    case IRQMP_PEXTACK1:\t\
    /* 0xC4 */\n-      *data = irqmp_pextack[1];\n-      break;\n-\n-    case IRQMP_PEXTACK2:\t\
    /* 0xC8 */\n-      *data = irqmp_pextack[2];\n-      break;\n-\n-    case IRQMP_PEXTACK3:\t\
    /* 0xCC */\n-      *data = irqmp_pextack[3];\n-      break;\n-\n     default:\n\
    -      if (addr >= IRQMP_IRQMAP && addr < IRQMP_IRQMAP + irqmp_irqmap)\n+    \
    \  if (addr >= IRQMP_IMR && addr < IRQMP_IMR + 4 * NCPU)\n+\t*data = irqmp_imr[(addr\
    \ - IRQMP_IMR) / 4];\n+      else if (addr >= IRQMP_IFR0 && addr < IRQMP_IFR0\
    \ + 4 * NCPU)\n+\t*data = irqmp_ifr[(addr - IRQMP_IFR0) / 4];\n+      else if\
    \ (addr >= IRQMP_PEXTACK0 && addr < IRQMP_PEXTACK0 + 4 * NCPU)\n+\t*data = irqmp_pextack[(addr\
    \ - IRQMP_PEXTACK0) / 4];\n+      else if (addr >= IRQMP_IRQMAP && addr < IRQMP_IRQMAP\
    \ + irqmp_irqmap)\n \t{\n \t  i = (addr - IRQMP_IRQMAP) & ~3;\n \t  *data = (irqmp_map[i]\
    \ << 24) | (irqmp_map[i + 1] << 16) |\n@@ -698,48 +647,18 @@ irqmp_write (uint32\
    \ addr, uint32 * data, uint32 size)\n       irqmp_ibr = *data & 0xfffe;\n    \
    \   break;\n \n-    case IRQMP_IMR:\t\t/* 0x40 */\n-      irqmp_imr[0] = *data\
    \ & irqmp_mask;\n-      chk_irq ();\n-      break;\n-\n-    case IRQMP_IMR1:\t\
    \t/* 0x44 */\n-      irqmp_imr[1] = *data & irqmp_mask;\n-      chk_irq ();\n\
    -      break;\n-\n-    case IRQMP_IMR2:\t\t/* 0x48 */\n-      irqmp_imr[2] = *data\
    \ & irqmp_mask;\n-      chk_irq ();\n-      break;\n-\n-    case IRQMP_IMR3:\t\
    \t/* 0x4C */\n-      irqmp_imr[3] = *data & irqmp_mask;\n-      chk_irq ();\n\
    -      break;\n-\n-    case IRQMP_IFR0:\t\t/* 0x80 */\n-      irqmp_ifr[0] = *data\
    \ & 0xfffe;\n-      chk_irq ();\n-      break;\n-\n-    case IRQMP_IFR1:\t\t/*\
    \ 0x84 */\n-      irqmp_ifr[1] = *data & 0xfffe;\n-      chk_irq ();\n-      break;\n\
    -\n-    case IRQMP_IFR2:\t\t/* 0x88 */\n-      irqmp_ifr[2] = *data & 0xfffe;\n\
    -      chk_irq ();\n-      break;\n-\n-    case IRQMP_IFR3:\t\t/* 0x8C */\n- \
    \     irqmp_ifr[3] = *data & 0xfffe;\n-      chk_irq ();\n-      break;\n-\n \
    \    default:\n-      if (addr >= IRQMP_IRQMAP && addr < IRQMP_IRQMAP + irqmp_irqmap)\n\
    +      if (addr >= IRQMP_IMR && addr < IRQMP_IMR + 4 * NCPU)\n+\t{\n+\t  irqmp_imr[(addr\
    \ - IRQMP_IMR) / 4] = *data & irqmp_mask;\n+\t  chk_irq ();\n+\t}\n+      else\
    \ if (addr >= IRQMP_IFR0 && addr < IRQMP_IFR0 + 4 * NCPU)\n+\t{\n+\t  irqmp_ifr[(addr\
    \ - IRQMP_IFR0) / 4] = *data & 0xfffe;\n+\t  chk_irq ();\n+\t}\n+      else if\
    \ (addr >= IRQMP_IRQMAP && addr < IRQMP_IRQMAP + irqmp_irqmap)\n \t{\n \t  /*\
    \ The IRQ(A)MP stores each map field modulo 32.  */\n \t  i = (addr - IRQMP_IRQMAP)\
    \ & ~3;\ndiff --git a/help.c b/help.c\nindex 2c3dc1a..9a322df 100644\n--- a/help.c\n\
    +++ b/help.c\n@@ -49,7 +49,7 @@ sis_usage ()\n   printf (\"  [-nfp]          \
    \     -> Disable the simulated FPU. Each FPU instruction will generate FPU disabled\
    \ trap.\\n\");\n   printf (\"  [-bridge <bridge>]   -> Connect the tap device\
    \ used for networking to <bridge>. Requires running as sudo/root.\\n\");\n   printf\
    \ (\"                          Typical values are br0 or lxcbr0.\\n\");\n-  printf\
    \ (\"  [-m <cores>]         -> Set number of <cores> in Leon3 or RISC-V. <cores>\
    \ can range from 2 to 4\\n\");\n+  printf (\"  [-m <cores>]         -> Set number\
    \ of <cores> in Leon3 or RISC-V. <cores> can range from 2 to 8\\n\");\n   printf\
    \ (\"  [-uart1 <device>]    -> Connect UART1 (serial port) of the simulator to\
    \ <device>. stdin/stdout is set as default.\\n\");\n   printf (\"  [-uart2 <device>]\
    \    -> Connect UART2 (serial port) of the simulator to <device>. Disabled by\
    \ default.\\n\");\n   printf (\"  [-dumbio]            -> Use simpler I/O mode\
    \ for restricted terminals.\\n\");\ndiff --git a/sis.h b/sis.h\nindex 917fcb1..a8beef5\
    \ 100644\n--- a/sis.h\n+++ b/sis.h\n@@ -40,7 +40,7 @@\n #define WPW_MAX\t256\n\
    \ \n /* Maximum number of cpus */\n-#define NCPU 4\n+#define NCPU 8\n \n /* size\
    \ of simulated memory */\n #define ROM_MASK  (ROM_SIZE - 1)\ndiff --git a/sis.texi\
    \ b/sis.texi\nindex f16f8e6..75e15e0 100644\n--- a/sis.texi\n+++ b/sis.texi\n\
    @@ -94,7 +94,7 @@ RISC-V (RV32IMACFD) processor with CLINT and ns16550 UART\n\
    \ \n @end table\n \n-The LEON3/4 and RISC-V emulation supports SMP with up to\
    \ four processor cores.\n+The LEON3/4 and RISC-V emulation supports SMP with up\
    \ to eight processor cores.\n \n @node Invoking sis\n @chapter Invoking sis\n\
    @@ -183,7 +183,7 @@ Connect the tap device used for networking to the host @var{bridge}.\n\
    \ Typical values are br0 or lxcbr0. Requires running SIS with sudo/root.\n \n\
    \ @item -m @var{cores}\n-Enable the number of @var{cores} (2 - 4) in a leon3 or\
    \ RISC-V multi-processor system.\n+Enable the number of @var{cores} (2 - 8) in\
    \ a leon3 or RISC-V multi-processor system.\n \n @item -uart1 @var{device}\n Connect\
    \ UART1 (console) of the simulator to @var{device}. stdin/stdout is default.\n\
    @@ -751,13 +751,13 @@ time and timeh CSR.\n @chapter Multi-processing \n @cindex\
    \ Multi-processing \n \n-When emulating a LEON3 or RISC-V processor, SIS can emulate\
    \ up to four cores\n+When emulating a LEON3 or RISC-V processor, SIS can emulate\
    \ up to eight cores\n in the target system (SMP). The cores are simulated in a\
    \ round-robin fashion\n with a time-slice of 50 clocks. Shorter or longer time-slices\
    \ can be selected\n using -d <clocks>.\n \n To start SIS with SMP, use the switch\
    \ -m <n> when starting the simulator\n-where n can be 2 - 4.\n+where n can be\
    \ 2 - 8.\n \n @node Networking\n @chapter Networking \n"
  type: inline

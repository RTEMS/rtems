    \ device in LEON5 mode\n+\n @item -griscv\n Emulate a GRISCV (RISCV/GRLIB) SOC\
    \ device\n \n@@ -693,7 +696,8 @@ The following IP cores from GRLIB are emulated\
    \ in GR740 mode:\n The IRQMP includes the eight interrupt map registers at offset\
    \ 0x300.  After\n reset, they map bus interrupt line n to interrupt line n.  A\

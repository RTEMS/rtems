    +@item 0xC0000000 - 0xC1000000 @tab ROM (16 Mbyte)\n+@item 0xFF900000 - 0xFFA00000\
    \ @tab APB bus\n+@item 0xFFFFF000 - 0xFFFFFFFF @tab AHB plug&play\n+@end multitable\n\
    +\n+Access to non-existing memory will result in a memory exception trap.\n+\n\

    +\n+from waflib import Context\n+\n+APPNAME = 'sis'\n+VERSION = '2.30'\n+\n+SOURCES\
    \ = [\n+    'erc32.c',\n+    'grlib.c',\n+    'leon3.c',\n+    'exec.c',\n+  \
    \  'func.c',\n+    'help.c',\n+    'sparc.c',\n+    'riscv.c',\n+    'leon2.c',\n\
    +    'sis.c',\n+    'interf.c',\n+    'remote.c',\n+    'elf.c',\n+    'greth.c',\n\
    +    'tap.c',\n+    'gr740.c',\n+    'rv32.c',\n+]\n+\n+HEADERS = ['fcntl.h',\
    \ 'stdlib.h', 'termios.h']\n+\n+\n+def options(opt):\n+    opt.load('compiler_c')\n\
    +    opt.add_option('--enable-l1cache',\n+                   action='store_true',\n\
    +                   default=False,\n+                   help='enable L1 cache\
    \ emulation')\n+    opt.add_option('--enable-optimization',\n+               \
    \    action='store',\n+                   default='2',\n+                   metavar='LEVEL',\n\
    +                   help='optimization level passed to -O [default: 2]')\n+  \
    \  opt.add_option('--without-readline',\n+                   action='store_true',\n\
    +                   default=False,\n+                   help='use the bundled\
    \ line editor even if readline exists')\n+\n+\n+def configure(conf):\n+    conf.load('compiler_c')\n\
    +\n+    conf.env.append_value('CFLAGS', ['-O' + conf.options.enable_optimization])\n\
    +    conf.env.append_value('CFLAGS', ['-g'])\n+    conf.env.append_value('DEFINES',\
    \ ['FAST_UART'])\n+\n+    for header in HEADERS:\n+        conf.check_cc(header_name=header,\
    \ mandatory=False)\n+\n+    if conf.check_endianness() == 'big':\n+        conf.define('WORDS_BIGENDIAN',\
    \ 1)\n+\n+    if conf.options.enable_l1cache:\n+        conf.define('ENABLE_L1CACHE',\
    \ 1)\n+\n+    conf.define('PACKAGE_VERSION', VERSION)\n+\n+    conf.env.LINENOISE\
    \ = True\n+    if not conf.options.without_readline:\n+        for libs in [['readline'],\
    \ ['readline', 'tinfo'],\n+                     ['readline', 'ncurses']]:\n+ \
    \           if conf.check_cc(header_name='readline/readline.h',\n+           \
    \                  lib=libs,\n+                             uselib_store='READLINE',\n\
    +                             define_name='',\n+                             msg='Checking\
    \ for readline (-l%s)' %\n+                             ' -l'.join(libs),\n+ \
    \                            mandatory=False):\n+                conf.define('HAVE_READLINE',\
    \ 1)\n+                conf.env.LINENOISE = False\n+                break\n+\n\
    +    if conf.env.DEST_OS == 'win32':\n+        conf.env.append_value('LIB', ['ws2_32',\
    \ 'kernel32'])\n+\n+    conf.write_config_header('config.h', remove=False)\n+\n\
    +\n+def build(bld):\n+    sources = list(SOURCES)\n+    if bld.env.LINENOISE:\n\
    +        sources.append('linenoise.c')\n+\n+    bld.program(source=sources,\n\
    +                target='sis',\n+                includes=['.'],\n+          \
    \      use='READLINE',\n+                lib=['m'])\n+\n+\n+def dtb(ctx):\n+ \
    \   \"\"\"regenerate rv32dtb.h from rv32.dts\"\"\"\n+    for tool in ['dtc', 'xxd']:\n\
    +        if not ctx.cmd_and_log(['which', tool], quiet=Context.BOTH,\n+      \
    \                         output=Context.STDOUT).strip():\n+            ctx.fatal('%s\
    \ is required to regenerate rv32dtb.h' % tool)\n+    ctx.exec_command('dtc -O\
    \ dtb rv32.dts -o rv32.dtb')\n+    ctx.exec_command('xxd --include rv32.dtb >\
    \ rv32dtb.h')\n+\n+\n+class DtbContext(Context.Context):\n+    cmd = 'dtb'\n+\
    \    fun = 'dtb'\n"

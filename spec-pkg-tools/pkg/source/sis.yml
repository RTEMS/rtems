- enabled-by: true
  patch: "From 664f2e4d86dbc7628ca1f565aaeced53d115933f Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Thu, 23 Jul\
    \ 2026 20:11:09 +0800\nSubject: [PATCH] build: Replace autotools with waf\n\n\
    The autotools build kept four generated files and build-aux/ in the\ntree.  No\
    \ matching automake was available.  Each new source needed an\nedit of Makefile.am\
    \ and a manual patch of Makefile.in.  A build of the\nmanual rewrote version.texi\
    \ and sis.info with the current date.\n\nVendor waf 2.1.9 as one script which\
    \ needs only Python 3.  List the\nsources once in wscript and build out of tree.\
    \  Write into config.h\nonly the seven macros which the sources read.  Add the\
    \ command\n./waf dtb, which regenerates rv32dtb.h from rv32.dts.  Remove the manual\n\
    from the build.  Delete sis.info and version.texi.  Move the four @set\nlines\
    \ of version.texi into sis.texi, so that makeinfo and texi2pdf\nstill process\
    \ it.\n\nThe readline check of configure tested only the library.  A host with\n\
    the library but without the headers passed the check, and sis.c then\nfailed to\
    \ compile.  Check readline/readline.h together with the\nlibrary.  Retry with\
    \ -ltinfo and with -lncurses.  Add the option\n--without-readline, which selects\
    \ the bundled linenoise.\n\nThe five GR740 reference binaries produce byte identical\
    \ output under\nboth builds.\n\nAssisted-by: Claude:claude-opus-5-5 claude-code\n\
    Signed-off-by: Sebastian Huber <sebastian.huber@embedded-brains.de>\n---\n .gitignore\
    \ |  14 ++----\n README.md  |  29 ++++++++----\n sis.texi   |   5 ++-\n waf  \
    \      | Bin 0 -> 110141 bytes\n wscript    | 127 +++++++++++++++++++++++++++++++++++++++++++++++++++++\n\
    \ 5 files changed, 156 insertions(+), 19 deletions(-)\n create mode 100755 waf\n\
    \ create mode 100644 wscript\n\ndiff --git a/.gitignore b/.gitignore\nindex b9163d4..36679d6\
    \ 100644\n--- a/.gitignore\n+++ b/.gitignore\n@@ -1,11 +1,5 @@\n-.deps\n-*.o\n\
    -autom4te.cache\n-config.h\n-config.log\n-config.status\n-Makefile\n-sis\n-stamp-h1\n\
    -stamp-vti\n+build\n+.lock-waf*\n+.waf-*\n+.waf3-*\n tmp\ndiff --git a/README.md\
    \ b/README.md\nindex 814e7a4..e0a591d 100644\n--- a/README.md\n+++ b/README.md\n\
    @@ -1,23 +1,36 @@\n SIS - Simple Instruction Simulator\n ==================================\n\
    \ \n-SIS uses the GNU autoconf system, and can simply be build using:\n+SIS uses\
    \ the waf build system, and can simply be built using:\n \n   ```shell\n-    ./configure\
    \ \n+  ./waf configure\n   ```\n \n-followed by \n+followed by\n \n   ```shell\n\
    -  make\n+  ./waf\n   ```\n \n-To build a PDF version of the manual, do\n+The\
    \ simulator is placed in `build/sis`. Install it with\n \n   ```shell\n-  make\
    \ sis.pdf.\n+  ./waf install --prefix=/usr/local\n   ```\n \n-To enable emulation\
    \ of an L1 cache, run configure with --enable-l1cache. This option\n-only improves\
    \ timing accuracy, it does not affect simulation behaviour.\n+Building requires\
    \ Python 3 for waf itself. The bundled `waf` script needs no\n+separate installation.\n\
    +\n+To enable emulation of an L1 cache, run configure with --enable-l1cache. This\n\
    +option only improves timing accuracy, it does not affect simulation behaviour.\n\
    +\n+The optimization level defaults to -O2 and can be changed with\n+--enable-optimization=LEVEL.\n\
    +\n+The manual is `sis.texi`. It is not built by waf; render it with\n+\n+  ```shell\n\
    +  makeinfo sis.texi\n+  texi2pdf sis.texi\n+  ```\ndiff --git a/sis.texi b/sis.texi\n\
    index 7e21421..ca9f091 100644\n--- a/sis.texi\n+++ b/sis.texi\n@@ -2,7 +2,10 @@\n\
    \ @setfilename sis.info\n @comment $Id@w{$}\n @comment %**start of header\n-@include\
    \ version.texi\n+@set UPDATED 30 July 2021\n+@set UPDATED-MONTH July 2021\n+@set\
    \ EDITION 2.30\n+@set VERSION 2.30\n @settitle SIS - Simple Instruction Simulator\
    \ @value{VERSION}\n @syncodeindex pg cp\n @comment %**end of header\ndiff --git\

  patch: "From ca9b5e3abd5e573dfe57ec0be98682f49fb86994 Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Sat, 26 Sep\
    \ 2026 15:02:42 +0200\nSubject: [PATCH] tap: Rewrite the TUN device setup\n\n\
    The TUN device setup in sis_tap_init() followed the tun_alloc() example\nof the\
    \ Linux document Documentation/networking/tuntap.txt.  The flags\ncomment was\
    \ a verbatim copy.  That document is copyright 1999-2000 Maxim\nKrasnyansky. \
    \ Linux distributes it under GPL-2.0 only, and since commit\n973d55e590be it carries\
    \ SPDX-License-Identifier: GPL-2.0.  Text under\nGPL-2.0 only cannot go into a\
    \ file under GPL-3.0-or-later.\n\nWrite the setup anew in tap_create() from the\
    \ TUNSETIFF interface of\n<linux/if_tun.h>.  Drop the reference to the document.\
    \  The device\ntype, the flags and the error messages stay the same.\n\nAssisted-by:\
    \ Claude:claude-opus-5-5 claude-code\nSigned-off-by: Sebastian Huber <sebastian.huber@embedded-brains.de>\n\
    ---\n tap.c | 51 +++++++++++++++++++++++++++++----------------------\n 1 file\
    \ changed, 29 insertions(+), 22 deletions(-)\n\ndiff --git a/tap.c b/tap.c\nindex\
    \ 99c2f2e..798322e 100644\n--- a/tap.c\n+++ b/tap.c\n@@ -1,5 +1,3 @@\n-/* Based\
    \ on Documentation/networking/tuntap.txt */\n-\n #include <stdio.h>\n #include\
    \ <string.h>\n #include <errno.h>\n@@ -27,37 +25,46 @@ static int tun_fd, nread,\
    \ br_socket_fd;\n static int br_add_interface (const char *bridge, const char\
    \ *dev);\n static void sis_tap_poll (int32 arg);\n \n-int\n-sis_tap_init (long\
    \ unsigned emac)\n+/*\n+ * The device carries Ethernet frames without a packet\
    \ information prefix.\n+ * The kernel selects the interface name and returns it\
    \ in ifr.\n+ */\n+static int\n+tap_create (void)\n {\n-  int i;\n-  long unsigned\
    \ xmac, xmac2;\n-  if (fd)\n-    return 1;\n-  if ((fd = open (\"/dev/net/tun\"\
    , O_RDWR)) < 0)\n+  int tap;\n+\n+  tap = open (\"/dev/net/tun\", O_RDWR);\n+\
    \  if (tap < 0)\n     {\n       printf (\"Cannot open TUN/TAP dev\\n\");\n-  \
    \    return 0;\n+      return tap;\n     }\n \n   memset (&ifr, 0, sizeof (ifr));\n\
    -\n-  /* Flags: IFF_TUN   - TUN device (no Ethernet headers)\n-   *        IFF_TAP\
    \   - TAP device\n-   *\n-   *        IFF_NO_PI - Do not provide packet information\n\
    -   */\n-\n   ifr.ifr_flags = IFF_TAP | IFF_NO_PI;\n-\n-  if ((err = ioctl (fd,\
    \ TUNSETIFF, (void *) &ifr)) < 0)\n+  err = ioctl (tap, TUNSETIFF, &ifr);\n+ \
    \ if (err < 0)\n     {\n       printf (\"ERR: Could not ioctl tun: %s\\n\", strerror\
    \ (errno));\n-      close (fd);\n-      return 0;\n+      close (tap);\n+    \
    \  return err;\n     }\n \n-  strcpy (dev, ifr.ifr_name);\n+  snprintf (dev, sizeof\
    \ (dev), \"%s\", ifr.ifr_name);\n+  return tap;\n+}\n+\n+int\n+sis_tap_init (long\
    \ unsigned emac)\n+{\n+  int i;\n+  long unsigned xmac, xmac2;\n+  if (fd)\n+\
    \    return 1;\n+  fd = tap_create ();\n+  if (fd < 0)\n+    return 0;\n \n  \
    \ sockfd = socket (PF_PACKET, SOCK_RAW, htons (ETH_P_ALL));\n \n"

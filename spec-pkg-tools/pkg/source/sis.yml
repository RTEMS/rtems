    +interrupt.  The IRQMP of the boards other than the GR740 and the GR765 has\n\
    +no interrupt map registers.\n \n @subsection Memory interface\n \n@@ -710,6 +714,49\
    \ @@ The following memory areas are valid for GR740:\n \n Access to non-existing\
    \ memory will result in a memory exception trap.\n \n+@section GR765 emulation\n\
    +\n+In GR765 mode, SIS emulates a limited subset of the GR765 octa-core LEON5\n\
    +system as defined in the GR765 datasheet.  The emulated system includes only\n\
    +the APBUART, GPTIMER, IRQMP and L2CACHE peripherals.  It includes 16 Mbyte\n\
    +ROM and 64 Mbyte RAM.  The processors read 5 in the version field of the\n+%psr\
    \ register.\n+\n+To start sis in GR765 mode, use the -gr765 switch.\n+\n+@subsection\
    \ GR765 peripherals\n+\n+The following IP cores from GRLIB are emulated in GR765\
    \ mode:\n+\n+@multitable {The long name of the core} {Address_long} {Interrupt}\n\
    +@headitem IP Core  @tab Address @tab Interrupt\n+@item  L2CACHE @tab 0xB1000000\
    \ @tab -\n+@item  APBMAST @tab 0xFF900000 @tab -\n+@item  APBUART @tab 0xFF900000\
    \ @tab 2\n+@item  IRQMP @tab 0xFF904000 @tab -\n+@item  GPTIMER @tab 0xFF908000\

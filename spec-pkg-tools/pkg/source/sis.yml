  patch: "From 92f21a2729a9000f8c4d044325eb1941fff5ef35 Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Tue, 29 Sep\
    \ 2026 03:05:09 +0200\nSubject: [PATCH] gr765: Add the GR765 in LEON5 mode\n\n\
    RTEMS has a BSP for the GR765.  SIS could not run it.\n\nAdd the -gr765 option.\
    \  Emulate eight LEON5 processors, the APBUART,\nthe GPTIMER, the L2CACHE and\
    \ the IRQ(A)MP with 16 interrupt map\nregisters and their reset map.  The extended\
    \ interrupt line is 12, and\nthe processors read 5 in the PSR version field.\n\
    \nAssisted-by: Claude:claude-opus-5-5 claude-code\nSigned-off-by: Sebastian Huber\
    \ <sebastian.huber@embedded-brains.de>\n---\n gr765.c  | 271 +++++++++++++++++++++++++++++++++++++++++++++++++++++++\n\
    \ grlib.c  |  17 ++++\n grlib.h  |   3 +-\n help.c   |   2 +-\n sis.c    |  13\
    \ +++\n sis.h    |   4 +\n sis.texi |  49 +++++++++-\n wscript  |   1 +\n 8 files\
    \ changed, 357 insertions(+), 3 deletions(-)\n create mode 100644 gr765.c\n\n\
    diff --git a/gr765.c b/gr765.c\nnew file mode 100644\nindex 0000000..fc57b51\n\
    --- /dev/null\n+++ b/gr765.c\n@@ -0,0 +1,271 @@\n+/* SPDX-License-Identifier:\

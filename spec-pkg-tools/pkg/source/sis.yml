  patch: "From 0753848f7514be292365a37b715b3393fe7f8f14 Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Thu, 23 Jul\
    \ 2026 21:59:59 +0800\nSubject: [PATCH] licenses: Adopt the REUSE conventions\n\
    \nNo file stated its license in a machine-readable form.  sparc.c,\nsparc.h and\
    \ tap.c had no license header at all.  The files without a\ncomment header named\
    \ neither a license nor a copyright holder.\n\nFollow the REUSE Specification\
    \ 3.3.  Add the license texts under\nLICENSES/ and one SPDX-License-Identifier\
    \ line to each existing header.\nKeep the copyright lines and the permission notices\
    \ as they are.\nAnnotate the files without a comment header in REUSE.toml.\n\n\
    Give sparc.c, sparc.h and tap.c a license header.\nThe origins of these files\
    \ and of the imported files are:\n\n  File              Origin\n  ----------------\
    \  ----------------------------------------------------\n  sparc.c, sparc.h  binutils-gdb\
    \ sim/erc32/exec.c at 61baf725eca\n  tap.c             Jiri Gaisler in 66efed8,\
    \ br_add_interface() from\n                    bridge-utils v1.6 libbridge/libbridge_if.c\n\
    \  linenoise.c/.h    antirez/linenoise, imported in d509fe6\n  elf.h         \
    \    GNU C Library elf/elf.h, imported in 6d69429\n  fdl.texi          the GFDL\
    \ 1.3 license document of the FSF\n  waf               waf 2.1.9 by Thomas Nagy\n\
    \nThe header of exec.c at 61baf725eca reads \"Copyright (C) 1995-2017 Free\nSoftware\
    \ Foundation, Inc.\" and \"Contributed by Jiri Gaisler, European\nSpace Agency\"\
    .  sparc.c and sparc.h carry this header, the same as\ntheir siblings erc32.c,\
    \ exec.c and sis.c.  binutils-gdb commit\n17d88f73c0e states the basis of the\
    \ FSF line: \"Permission was granted\nby Jiri Gaisler, who has a copyright assignment\
    \ on file for GDB.\"\n\nThe bridge-utils file is copyright 2000 Lennert Buytenhek\
    \ under\nGPL-2.0-or-later.  This license permits GPL-3.0-or-later, so tap.c\n\
    keeps the project license and adds his copyright line.  It also adds\nembedded\
    \ brains for the TUN device setup.\n\nThe linenoise files carry a BSD-2-Clause\
    \ header without an SPDX tag.\nEach annotation gives the years of its own header.\
    \  The notice of\nfdl.texi permits verbatim copies only.  LicenseRef-GFDL-1.3-verbatim\n\
    records that notice.\n\nREADME.md, .gitignore, CODEOWNERS, .gitlab/gitlab-ci.yml,\
    \ rv32.dts and\nrv32dtb.h carry no license notice.  Their authors contributed\
    \ them to a\nproject under GPL-3.0-or-later, and none of them granted another\n\
    license.  Thus the annotations give them GPL-3.0-or-later.  The holders\nare the\
    \ authors of the lines which git blame shows today.  rv32dtb.h is\ngenerated from\
    \ rv32.dts with dtc and xxd.\n\nAssisted-by: Claude:claude-opus-5-5 claude-code\n\
    Signed-off-by: Sebastian Huber <sebastian.huber@embedded-brains.de>\n---\n LICENSES/BSD-2-Clause.txt\

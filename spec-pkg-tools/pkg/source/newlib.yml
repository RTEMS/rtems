  patch: "From 373efee010a98585a9a6abb69e1cec1fdd4e795d Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Sun, 27 Sep\
    \ 2026 14:39:19 +0200\nSubject: [PATCH] RTEMS: Add tm_gmtoff and tm_zone to struct\
    \ tm\n\nPOSIX.1-2024 requires the tm_gmtoff and tm_zone members of struct tm.\n\
    The gmtime() and gmtime_r() functions set tm_zone to \"UTC\".\n\nEnable the members\
    \ for RTEMS.  Add them to struct __tm as well, which\nholds the result of gmtime()\
    \ and localtime().  Set them in gmtime_r(),\nlocaltime_r() and mktime().  Check\
    \ the result of gmtime_r() in\nlocaltime_r(), since gmtime_r() may report an overflow.\n\
    \nAssisted-by: Claude:claude-opus-5-5 claude-code\nSigned-off-by: Sebastian Huber\
    \ <sebastian.huber@embedded-brains.de>\n---\n newlib/libc/include/sys/config.h\
    \ | 2 ++\n newlib/libc/include/sys/reent.h  | 6 ++++++\n newlib/libc/time/gmtime_r.c\
    \      | 6 ++++++\n newlib/libc/time/lcltime_r.c     | 8 ++++++++\n newlib/libc/time/mktime.c\
    \        | 9 +++++++++\n 5 files changed, 31 insertions(+)\n\ndiff --git a/newlib/libc/include/sys/config.h\
    \ b/newlib/libc/include/sys/config.h\nindex c3cd51e..bf7b436 100644\n--- a/newlib/libc/include/sys/config.h\n\
    +++ b/newlib/libc/include/sys/config.h\n@@ -245,6 +245,8 @@\n \n #if defined(__rtems__)\n\
    \ #define __FILENAME_MAX__ 255\n+#define __TM_GMTOFF tm_gmtoff\n+#define __TM_ZONE\
    \ tm_zone\n #define _READ_WRITE_RETURN_TYPE _ssize_t\n #define __DYNAMIC_REENT__\n\
    \ #endif\ndiff --git a/newlib/libc/include/sys/reent.h b/newlib/libc/include/sys/reent.h\n\
    index eafac96..4a35fdf 100644\n--- a/newlib/libc/include/sys/reent.h\n+++ b/newlib/libc/include/sys/reent.h\n\
    @@ -69,6 +69,12 @@ struct __tm\n   int   __tm_wday;\n   int   __tm_yday;\n   int\
    \   __tm_isdst;\n+#ifdef __TM_GMTOFF\n+  long  __tm_gmtoff;\n+#endif\n+#ifdef\
    \ __TM_ZONE\n+  const char *__tm_zone;\n+#endif\n };\n \n /*\ndiff --git a/newlib/libc/time/gmtime_r.c\
    \ b/newlib/libc/time/gmtime_r.c\nindex 8bf9ee5..c97c212 100644\n--- a/newlib/libc/time/gmtime_r.c\n\
    +++ b/newlib/libc/time/gmtime_r.c\n@@ -95,6 +95,12 @@ gmtime_r (const time_t *__restrict\
    \ tim_p,\n   res->tm_mday = day;\n \n   res->tm_isdst = 0;\n+#ifdef __TM_GMTOFF\n\
    +  res->__TM_GMTOFF = 0;\n+#endif\n+#ifdef __TM_ZONE\n+  res->__TM_ZONE = \"UTC\"\
    ;\n+#endif\n \n   return (res);\n }\ndiff --git a/newlib/libc/time/lcltime_r.c\
    \ b/newlib/libc/time/lcltime_r.c\nindex 9b9126b..e9d8f95 100644\n--- a/newlib/libc/time/lcltime_r.c\n\
    +++ b/newlib/libc/time/lcltime_r.c\n@@ -26,6 +26,8 @@ localtime_r (const time_t\
    \ *__restrict tim_p,\n   const int *ip;\n \n   res = gmtime_r (tim_p, res);\n\
    +  if (res == NULL)\n+    return NULL;\n \n   year = res->tm_year + YEAR_BASE;\n\
    \   ip = __month_lengths[isleap(year)];\n@@ -49,6 +51,12 @@ localtime_r (const\
    \ time_t *__restrict tim_p,\n   offset = (res->tm_isdst == 1\n     ? tz->__tzrule[1].offset\n\
    \     : tz->__tzrule[0].offset);\n+#ifdef __TM_GMTOFF\n+  res->__TM_GMTOFF = -offset;\n\
    +#endif\n+#ifdef __TM_ZONE\n+  res->__TM_ZONE = _tzname[res->tm_isdst == 1];\n\
    +#endif\n \n   hours = (int) (offset / SECSPERHOUR);\n   offset = offset % SECSPERHOUR;\n\
    diff --git a/newlib/libc/time/mktime.c b/newlib/libc/time/mktime.c\nindex 0203259..ee324a5\
    \ 100644\n--- a/newlib/libc/time/mktime.c\n+++ b/newlib/libc/time/mktime.c\n@@\
    \ -269,6 +269,15 @@ mktime (struct tm *tim_p)\n   else /* otherwise assume std\
    \ time */\n     tim += (time_t) tz->__tzrule[0].offset;\n \n+#ifdef __TM_GMTOFF\n\
    +  tim_p->__TM_GMTOFF = -(isdst == 1\n+    ? tz->__tzrule[1].offset\n+    : tz->__tzrule[0].offset);\n\
    +#endif\n+#ifdef __TM_ZONE\n+  tim_p->__TM_ZONE = _tzname[isdst == 1];\n+#endif\n\
    +\n   TZ_UNLOCK;\n \n   /* reset isdst flag to what we have calculated */\n--\
    \ \n2.53.0\n\n"

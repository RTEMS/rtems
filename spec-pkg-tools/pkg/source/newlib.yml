    \        |  32 +\n newlib/libm/machine/moxie/feholdexcept.c      |  33 +\n newlib/libm/machine/moxie/feraiseexcept.c\
    \     |  33 +\n newlib/libm/machine/moxie/fesetenv.c          |  33 +\n newlib/libm/machine/moxie/fesetexceptflag.c\
    \   |  34 +\n newlib/libm/machine/moxie/fesetround.c        |  32 +\n newlib/libm/machine/moxie/fetestexcept.c\

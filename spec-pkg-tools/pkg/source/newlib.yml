  patch: "From 5d16f78ec41f8ca730beb90968350938c9d794ab Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Sat, 3 Oct 2026\
    \ 09:40:22 +0200\nSubject: [PATCH] libm: Add fenv for microblaze, moxie and or1k\n\
    \nThe three targets had no floating-point environment.  They used the\ngeneric\
    \ stubs, so fesetenv() and the other functions returned -ENOTSUP.\n\nAdd a sys/fenv.h\
    \ and the fenv functions for each target.  The\nsoft-float support of GCC records\
    \ no exception and rounds to nearest\nonly.  For this case FE_ALL_EXCEPT is zero,\
    \ FE_TONEAREST is the only\nrounding mode and every function succeeds.  On or1k\
    \ with\n__or1k_hard_float__ the functions use the floating-point control\nstatus\
    \ register, which also holds the state of the soft-float support\nof libgcc.\n\
    \nAssisted-by: Claude:claude-opus-5-5 claude-code\nSigned-off-by: Sebastian Huber\
    \ <sebastian.huber@embedded-brains.de>\n---\n newlib/Makefile.in             \
    \               | 794 ++++++++++++++++--\n newlib/configure                  \
    \            |  42 +\n newlib/configure.host                         |   3 +\n\
    \ newlib/libc/machine/microblaze/sys/fenv.h     |  42 +\n newlib/libc/machine/moxie/sys/fenv.h\
    \          |  42 +\n newlib/libc/machine/or1k/sys/fenv.h           |  64 ++\n\
    \ newlib/libm/Makefile.inc                      |   9 +\n newlib/libm/acinclude.m4\
    \                      |   3 +-\n newlib/libm/machine/microblaze/Makefile.inc\
    \   |   5 +\n .../libm/machine/microblaze/feclearexcept.c   |  33 +\n newlib/libm/machine/microblaze/fegetenv.c\
    \     |  33 +\n .../libm/machine/microblaze/fegetexceptflag.c |  34 +\n newlib/libm/machine/microblaze/fegetround.c\
    \   |  32 +\n newlib/libm/machine/microblaze/feholdexcept.c |  33 +\n .../libm/machine/microblaze/feraiseexcept.c\
    \   |  33 +\n newlib/libm/machine/microblaze/fesetenv.c     |  33 +\n .../libm/machine/microblaze/fesetexceptflag.c\
    \ |  34 +\n newlib/libm/machine/microblaze/fesetround.c   |  32 +\n newlib/libm/machine/microblaze/fetestexcept.c\
    \ |  33 +\n newlib/libm/machine/microblaze/feupdateenv.c  |  33 +\n newlib/libm/machine/moxie/Makefile.inc\
    \        |   5 +\n newlib/libm/machine/moxie/feclearexcept.c     |  33 +\n newlib/libm/machine/moxie/fegetenv.c\

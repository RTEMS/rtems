  patch: "From 96084b216c7c56e9e1bc1220194c32f9569ee72c Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Mon, 6 Jul 2026\
    \ 04:30:00 +0200\nSubject: [PATCH 2/2] libc/time: Add C23 timespec_getres() and\
    \ timegm()\n\nAdd also TIME_MONOTONIC. These interfaces are defined in the C23\n\
    standard.\n\nSigned-off-by: Sebastian Huber <sebastian.huber@embedded-brains.de>\n\
    ---\n newlib/libc/include/time.h | 5 +++++\n 1 file changed, 5 insertions(+)\n\
    \ndiff --git a/newlib/libc/include/time.h b/newlib/libc/include/time.h\nindex\
    \ 58c5066ed..072aca4ef 100644\n--- a/newlib/libc/include/time.h\n+++ b/newlib/libc/include/time.h\n\
    @@ -62,6 +62,11 @@ time_t\t   time (time_t *_timer);\n \n int        timespec_get(struct\
    \ timespec *ts, int base);\n #endif\n+#if __BSD_VISIBLE || __ISO_C_VISIBLE >=\
    \ 2023\n+#define TIME_MONOTONIC 2\n+int\t   timespec_getres(struct timespec *,\
    \ int);\n+time_t\t   timegm(struct tm * const);\n+#endif\n #ifndef _REENT_ONLY\n\
    \ char\t  *asctime (const struct tm *_tblock);\n char\t  *ctime (const time_t\
    \ *_time);\n-- \n2.53.0\n\n"

    \         |   6 +\n newlib/libm/machine/or1k/feclearexcept.c      |  46 +\n newlib/libm/machine/or1k/fegetenv.c\
    \           |  46 +\n newlib/libm/machine/or1k/fegetexceptflag.c    |  47 ++\n\
    \ newlib/libm/machine/or1k/fegetround.c         |  44 +\n newlib/libm/machine/or1k/feholdexcept.c\
    \       |  50 ++\n newlib/libm/machine/or1k/feraiseexcept.c      |  46 +\n newlib/libm/machine/or1k/fesetenv.c\

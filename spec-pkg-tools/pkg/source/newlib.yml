  patch: "From a9d7ffc2434c4f5e64f44f159de986b72245ef7a Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Fri, 3 Jul 2026\
    \ 02:15:50 +0200\nSubject: [PATCH] RTEMS: Make `<semaphore.h>` self-contained\n\
    \nDefine `clockid_t` if necessary to allow using sem_clockwait() simply by\nincluding\
    \ `<semaphore.h>`.\n\nSigned-off-by: Sebastian Huber <sebastian.huber@embedded-brains.de>\n\
    ---\n newlib/libc/sys/rtems/include/semaphore.h | 8 +++++++-\n 1 file changed,\
    \ 7 insertions(+), 1 deletion(-)\n\ndiff --git a/newlib/libc/sys/rtems/include/semaphore.h\
    \ b/newlib/libc/sys/rtems/include/semaphore.h\nindex 6d756d522..d81a10c21 100644\n\
    --- a/newlib/libc/sys/rtems/include/semaphore.h\n+++ b/newlib/libc/sys/rtems/include/semaphore.h\n\
    @@ -57,7 +57,13 @@ int\t sem_unlink(const char *);\n int\t sem_wait(sem_t *);\n\
    \ \n #if (__GNU_VISIBLE || __POSIX_VISIBLE >= 202405)\n-int sem_clockwait(sem_t\
    \ * __restrict, __clockid_t,\n+#if !defined(__clockid_t_defined) && !defined(_CLOCKID_T_DECLARED)\n\
    +typedef\t__clockid_t\tclockid_t;\n+#define\t__clockid_t_defined\n+#define\t_CLOCKID_T_DECLARED\n\
    +#endif\n+\n+int sem_clockwait(sem_t * __restrict, clockid_t,\n        const struct\
    \ timespec * __restrict);\n #endif /* __GNU_VISIBLE || __POSIX_VISIBLE >= 202405\
    \ */\n \n-- \n2.53.0\n\n"

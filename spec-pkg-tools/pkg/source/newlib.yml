    \ newlib/libm/machine/or1k/fesetround.c         |  48 ++\n newlib/libm/machine/or1k/fetestexcept.c\
    \       |  45 +\n newlib/libm/machine/or1k/feupdateenv.c        |  49 ++\n newlib/libm/machine/or1k/or1k-fenv.h\
    \          |  55 ++\n 45 files changed, 2253 insertions(+), 60 deletions(-)\n\
    \ create mode 100644 newlib/libc/machine/microblaze/sys/fenv.h\n create mode 100644\

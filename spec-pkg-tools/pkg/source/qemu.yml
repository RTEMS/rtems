  patch: "From 75c9bbebc02583c7bde0a4fe39e4088d1e568d83 Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Fri, 21 Aug\
    \ 2026 14:54:40 +0200\nSubject: [PATCH 1/2] hw/timer/xilinx_timer: Start on the\
    \ enable edge\n\nEvery write to a control register which has the enable bit set\n\
    restarted the count from the load value.  A guest which clears the\ninterrupt\
    \ of a periodic timer writes that register with the enable bit\nstill set, so\
    \ every period gained the latency of the interrupt.  The\nRTEMS clock tick of\
    \ the petalogix-s3adsp1800 machine ran 0.5 percent\nlong with -icount and 2.5\
    \ to 3.4 percent long in host time.\n\nStart the count only where the enable bit\
    \ goes from zero to one.  The\ndata sheet of the AXI Timer gives the reload of\
    \ the counter to the load\nbit.\n\nAssisted-by: Claude:claude-opus-5 claude-code\n\
    Signed-off-by: Sebastian Huber <sebastian.huber@embedded-brains.de>\n---\n hw/timer/xilinx_timer.c\
    \ | 12 ++++++++++--\n 1 file changed, 10 insertions(+), 2 deletions(-)\n\ndiff\
    \ --git a/hw/timer/xilinx_timer.c b/hw/timer/xilinx_timer.c\nindex 8a502dae0e..dff439c623\
    \ 100644\n--- a/hw/timer/xilinx_timer.c\n+++ b/hw/timer/xilinx_timer.c\n@@ -175,17\
    \ +175,25 @@ timer_write(void *opaque, hwaddr addr,\n     addr &= 3;\n     switch\
    \ (addr) \n     {\n-        case R_TCSR:\n+        case R_TCSR: {\n+         \
    \   uint32_t old = xt->regs[R_TCSR];\n+\n             if (value & TCSR_TINT)\n\
    \                 value &= ~TCSR_TINT;\n \n             xt->regs[addr] = value\
    \ & 0x7ff;\n-            if (value & TCSR_ENT) {\n+            /*\n+         \
    \    * Only a transition of the enable bit to one starts the count.\n+       \
    \      * A write which leaves the bit set, such as the acknowledge of\n+     \
    \        * an interrupt, does not restart it.\n+             */\n+           \
    \ if ((value & TCSR_ENT) && !(old & TCSR_ENT)) {\n                 ptimer_transaction_begin(xt->ptimer);\n\
    \                 timer_enable(xt);\n                 ptimer_transaction_commit(xt->ptimer);\n\
    \             }\n             break;\n+        }\n  \n         default:\n    \
    \         if (addr < ARRAY_SIZE(xt->regs))\n-- \n2.53.0\n\n"

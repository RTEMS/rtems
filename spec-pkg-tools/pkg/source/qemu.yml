  patch: "From 01ffafcb9158b8b45bf798959f900816b16483d7 Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Sun, 4 Oct 2026\
    \ 13:51:16 +0200\nSubject: [PATCH 1/2] hw/watchdog: Add the Xilinx Timebase Watchdog\n\
    \nQEMU has no model of the Xilinx XPS and AXI Timebase Watchdog Timer.  A\nMicroBlaze\
    \ system resets itself through this watchdog.\n\nAdd a model.  The first expiry\
    \ of the timer sets the watchdog state and\nraises the interrupt.  The second\
    \ expiry performs the watchdog action\nand sets the reset status, which survives\
    \ the reset.\n\nAssisted-by: Claude:claude-opus-5-5 claude-code\nSigned-off-by:\
    \ Sebastian Huber <sebastian.huber@embedded-brains.de>\n---\n hw/watchdog/Kconfig\
    \               |   4 +\n hw/watchdog/meson.build           |   1 +\n hw/watchdog/xilinx_timebase_wdt.c\
    \ | 266 ++++++++++++++++++++++++++++++\n 3 files changed, 271 insertions(+)\n\
    \ create mode 100644 hw/watchdog/xilinx_timebase_wdt.c\n\ndiff --git a/hw/watchdog/Kconfig\
    \ b/hw/watchdog/Kconfig\nindex 55f77c5c8..ac7b2d323 100644\n--- a/hw/watchdog/Kconfig\n\
    +++ b/hw/watchdog/Kconfig\n@@ -28,3 +28,7 @@ config WDT_SBSA\n config ALLWINNER_WDT\n\
    \     bool\n     select PTIMER\n+\n+config XILINX_TIMEBASE_WDT\n+    bool\n+ \
    \   select PTIMER\ndiff --git a/hw/watchdog/meson.build b/hw/watchdog/meson.build\n\
    index 5edae65a3..e70e5311d 100644\n--- a/hw/watchdog/meson.build\n+++ b/hw/watchdog/meson.build\n\
    @@ -8,4 +8,5 @@ system_ss.add(when: 'CONFIG_ASPEED_SOC', if_true: files('wdt_aspeed.c'))\n\
    \ system_ss.add(when: 'CONFIG_WDT_IMX2', if_true: files('wdt_imx2.c'))\n system_ss.add(when:\
    \ 'CONFIG_K230_WDT', if_true: files('k230_wdt.c'))\n system_ss.add(when: 'CONFIG_WDT_SBSA',\
    \ if_true: files('sbsa_gwdt.c'))\n+system_ss.add(when: 'CONFIG_XILINX_TIMEBASE_WDT',\
    \ if_true: files('xilinx_timebase_wdt.c'))\n specific_ss.add(when: 'CONFIG_PSERIES',\
    \ if_true: files('spapr_watchdog.c'))\ndiff --git a/hw/watchdog/xilinx_timebase_wdt.c\
    \ b/hw/watchdog/xilinx_timebase_wdt.c\nnew file mode 100644\nindex 000000000..002a6bace\n\
    --- /dev/null\n+++ b/hw/watchdog/xilinx_timebase_wdt.c\n@@ -0,0 +1,266 @@\n+/*\n\
    + * Xilinx XPS and AXI Timebase Watchdog Timer\n+ *\n+ * Copyright (C) 2026 embedded\
    \ brains GmbH & Co. KG\n+ *\n+ * SPDX-License-Identifier: GPL-2.0-or-later\n+\
    \ *\n+ * The timer expires after 2^wdt-interval clock cycles.  The first expiry\n\
    + * sets the watchdog state and raises the interrupt.  An expiry with the\n+ *\
    \ watchdog state set asserts the reset and sets the reset status.  Writing a\n\
    + * one to the watchdog state clears it and restarts the interval.  The timer\n\
    + * runs while one of the two enable bits is set.\n+ */\n+\n+#include \"qemu/osdep.h\"\
    \n+#include \"qapi/error.h\"\n+#include \"hw/core/sysbus.h\"\n+#include \"hw/core/irq.h\"\
    \n+#include \"hw/core/ptimer.h\"\n+#include \"hw/core/qdev-properties.h\"\n+#include\
    \ \"hw/core/qdev-properties-system.h\"\n+#include \"migration/vmstate.h\"\n+#include\
    \ \"qemu/timer.h\"\n+#include \"qemu/module.h\"\n+#include \"qom/object.h\"\n\
    +#include \"system/watchdog.h\"\n+\n+#define R_TWCSR0 0\n+#define R_TWCSR1 1\n\
    +#define R_TBR    2\n+#define R_MAX    4\n+\n+#define TWCSR_EWDT2 (1U << 0)\n\
    +#define TWCSR0_EWDT1 (1U << 1)\n+#define TWCSR0_WDS (1U << 2)\n+#define TWCSR0_WRS\
    \ (1U << 3)\n+\n+#define TYPE_XILINX_TIMEBASE_WDT \"xlnx.xps-timebase-wdt\"\n\
    +OBJECT_DECLARE_SIMPLE_TYPE(XilinxTimebaseWdtState, XILINX_TIMEBASE_WDT)\n+\n\
    +struct XilinxTimebaseWdtState {\n+    SysBusDevice parent_obj;\n+\n+    EndianMode\
    \ model_endianness;\n+    MemoryRegion mmio;\n+    qemu_irq irq;\n+    ptimer_state\
    \ *ptimer;\n+    uint32_t freq_hz;\n+    uint8_t interval;\n+\n+    bool ewdt1;\n\
    +    bool ewdt2;\n+    bool wds;\n+    /* The reset status survives the reset\
    \ which it reports. */\n+    bool wrs;\n+    int64_t timebase_start_ns;\n+};\n\
    +\n+static bool wdt_enabled(XilinxTimebaseWdtState *s)\n+{\n+    return s->ewdt1\
    \ || s->ewdt2;\n+}\n+\n+static void wdt_update_irq(XilinxTimebaseWdtState *s)\n\
    +{\n+    qemu_set_irq(s->irq, s->wds);\n+}\n+\n+/* Must be called inside ptimer\
    \ transaction block */\n+static void wdt_restart(XilinxTimebaseWdtState *s)\n\
    +{\n+    ptimer_stop(s->ptimer);\n+    s->timebase_start_ns = qemu_clock_get_ns(QEMU_CLOCK_VIRTUAL);\n\
    +\n+    if (wdt_enabled(s)) {\n+        ptimer_set_limit(s->ptimer, 1ULL << s->interval,\
    \ 1);\n+        ptimer_run(s->ptimer, 0);\n+    }\n+}\n+\n+static uint32_t wdt_twcsr0(XilinxTimebaseWdtState\
    \ *s)\n+{\n+    return (s->wrs ? TWCSR0_WRS : 0) | (s->wds ? TWCSR0_WDS : 0) |\n\
    +           (s->ewdt1 ? TWCSR0_EWDT1 : 0) | (s->ewdt2 ? TWCSR_EWDT2 : 0);\n+}\n\
    +\n+static uint64_t wdt_read(void *opaque, hwaddr addr, unsigned int size)\n+{\n\
    +    XilinxTimebaseWdtState *s = opaque;\n+    int64_t ns;\n+\n+    switch (addr\
    \ >> 2) {\n+    case R_TWCSR0:\n+        return wdt_twcsr0(s);\n+    case R_TWCSR1:\n\
    +        return s->ewdt2 ? TWCSR_EWDT2 : 0;\n+    case R_TBR:\n+        ns = qemu_clock_get_ns(QEMU_CLOCK_VIRTUAL)\
    \ - s->timebase_start_ns;\n+        return (uint32_t)muldiv64(ns, s->freq_hz,\
    \ NANOSECONDS_PER_SECOND);\n+    default:\n+        return 0;\n+    }\n+}\n+\n\
    +static void wdt_write(void *opaque, hwaddr addr, uint64_t val64,\n+         \
    \             unsigned int size)\n+{\n+    XilinxTimebaseWdtState *s = opaque;\n\
    +    uint32_t value = val64;\n+    bool was_enabled = wdt_enabled(s);\n+    bool\
    \ restart = false;\n+\n+    switch (addr >> 2) {\n+    case R_TWCSR0:\n+     \
    \   if (value & TWCSR0_WRS) {\n+            s->wrs = false;\n+        }\n+   \
    \     if (value & TWCSR0_WDS) {\n+            s->wds = false;\n+            restart\
    \ = true;\n+        }\n+        s->ewdt1 = value & TWCSR0_EWDT1;\n+        s->ewdt2\
    \ = value & TWCSR_EWDT2;\n+        break;\n+    case R_TWCSR1:\n+        s->ewdt2\
    \ = value & TWCSR_EWDT2;\n+        break;\n+    default:\n+        return;\n+\
    \    }\n+\n+    if (restart || was_enabled != wdt_enabled(s)) {\n+        ptimer_transaction_begin(s->ptimer);\n\
    +        wdt_restart(s);\n+        ptimer_transaction_commit(s->ptimer);\n+  \
    \  }\n+\n+    wdt_update_irq(s);\n+}\n+\n+static const MemoryRegionOps wdt_ops[2]\
    \ = {\n+    [0 ... 1] = {\n+        .read = wdt_read,\n+        .write = wdt_write,\n\
    +        .impl = {\n+            .min_access_size = 4,\n+            .max_access_size\
    \ = 4,\n+        },\n+        .valid = {\n+            .min_access_size = 4,\n\
    +            .max_access_size = 4,\n+        },\n+    },\n+    [0].endianness\
    \ = DEVICE_LITTLE_ENDIAN,\n+    [1].endianness = DEVICE_BIG_ENDIAN,\n+};\n+\n\
    +static void wdt_expired(void *opaque)\n+{\n+    XilinxTimebaseWdtState *s = opaque;\n\
    +\n+    if (s->wds) {\n+        s->wrs = true;\n+        watchdog_perform_action();\n\
    +    } else {\n+        s->wds = true;\n+        wdt_update_irq(s);\n+    }\n\
    +}\n+\n+static void xilinx_timebase_wdt_reset(DeviceState *dev)\n+{\n+    XilinxTimebaseWdtState\
    \ *s = XILINX_TIMEBASE_WDT(dev);\n+\n+    s->ewdt1 = false;\n+    s->ewdt2 = false;\n\
    +    s->wds = false;\n+    ptimer_transaction_begin(s->ptimer);\n+    wdt_restart(s);\n\
    +    ptimer_transaction_commit(s->ptimer);\n+    wdt_update_irq(s);\n+}\n+\n+static\
    \ void xilinx_timebase_wdt_realize(DeviceState *dev, Error **errp)\n+{\n+    XilinxTimebaseWdtState\
    \ *s = XILINX_TIMEBASE_WDT(dev);\n+\n+    if (s->model_endianness == ENDIAN_MODE_UNSPECIFIED)\
    \ {\n+        error_setg(errp, TYPE_XILINX_TIMEBASE_WDT \" property 'endianness'\"\
    \n+                         \" must be set to 'big' or 'little'\");\n+       \
    \ return;\n+    }\n+\n+    if (s->interval < 8 || s->interval > 31) {\n+     \
    \   error_setg(errp, TYPE_XILINX_TIMEBASE_WDT \" property 'wdt-interval'\"\n+\
    \                         \" must be in the range from 8 to 31\");\n+        return;\n\
    +    }\n+\n+    s->ptimer = ptimer_init(wdt_expired, s, PTIMER_POLICY_LEGACY);\n\
    +    ptimer_transaction_begin(s->ptimer);\n+    ptimer_set_freq(s->ptimer, s->freq_hz);\n\
    +    ptimer_transaction_commit(s->ptimer);\n+\n+    memory_region_init_io(&s->mmio,\
    \ OBJECT(s),\n+                          &wdt_ops[s->model_endianness == ENDIAN_MODE_BIG],\n\
    +                          s, TYPE_XILINX_TIMEBASE_WDT, R_MAX * 4);\n+    sysbus_init_mmio(SYS_BUS_DEVICE(dev),\
    \ &s->mmio);\n+}\n+\n+static void xilinx_timebase_wdt_init(Object *obj)\n+{\n\
    +    XilinxTimebaseWdtState *s = XILINX_TIMEBASE_WDT(obj);\n+\n+    sysbus_init_irq(SYS_BUS_DEVICE(obj),\
    \ &s->irq);\n+}\n+\n+static const VMStateDescription vmstate_xilinx_timebase_wdt\
    \ = {\n+    .name = TYPE_XILINX_TIMEBASE_WDT,\n+    .version_id = 1,\n+    .minimum_version_id\
    \ = 1,\n+    .fields = (const VMStateField[]) {\n+        VMSTATE_PTIMER(ptimer,\
    \ XilinxTimebaseWdtState),\n+        VMSTATE_BOOL(ewdt1, XilinxTimebaseWdtState),\n\
    +        VMSTATE_BOOL(ewdt2, XilinxTimebaseWdtState),\n+        VMSTATE_BOOL(wds,\
    \ XilinxTimebaseWdtState),\n+        VMSTATE_BOOL(wrs, XilinxTimebaseWdtState),\n\
    +        VMSTATE_INT64(timebase_start_ns, XilinxTimebaseWdtState),\n+        VMSTATE_END_OF_LIST()\n\
    +    }\n+};\n+\n+static const Property xilinx_timebase_wdt_properties[] = {\n\
    +    DEFINE_PROP_ENDIAN_NODEFAULT(\"endianness\", XilinxTimebaseWdtState,\n+ \
    \                                model_endianness),\n+    DEFINE_PROP_UINT32(\"\
    clock-frequency\", XilinxTimebaseWdtState, freq_hz,\n+                       62\
    \ * 1000000),\n+    DEFINE_PROP_UINT8(\"wdt-interval\", XilinxTimebaseWdtState,\
    \ interval, 30),\n+};\n+\n+static void xilinx_timebase_wdt_class_init(ObjectClass\
    \ *klass,\n+                                           const void *data)\n+{\n\
    +    DeviceClass *dc = DEVICE_CLASS(klass);\n+\n+    dc->realize = xilinx_timebase_wdt_realize;\n\
    +    device_class_set_legacy_reset(dc, xilinx_timebase_wdt_reset);\n+    dc->vmsd\
    \ = &vmstate_xilinx_timebase_wdt;\n+    device_class_set_props(dc, xilinx_timebase_wdt_properties);\n\
    +    set_bit(DEVICE_CATEGORY_WATCHDOG, dc->categories);\n+}\n+\n+static const\
    \ TypeInfo xilinx_timebase_wdt_info = {\n+    .name          = TYPE_XILINX_TIMEBASE_WDT,\n\
    +    .parent        = TYPE_SYS_BUS_DEVICE,\n+    .instance_size = sizeof(XilinxTimebaseWdtState),\n\
    +    .instance_init = xilinx_timebase_wdt_init,\n+    .class_init    = xilinx_timebase_wdt_class_init,\n\
    +};\n+\n+static void xilinx_timebase_wdt_register_types(void)\n+{\n+    type_register_static(&xilinx_timebase_wdt_info);\n\
    +}\n+\n+type_init(xilinx_timebase_wdt_register_types)\n-- \n2.53.0\n\n"
  type: inline

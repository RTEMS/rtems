  patch: "From 085d0873d8983ffb85dd56e46c809bdf31edb327 Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Sun, 4 Oct 2026\
    \ 13:51:16 +0200\nSubject: [PATCH 2/2] hw/microblaze: Add the S3ADSP1800 watchdog\n\
    \nThe petalogix-s3adsp1800 machine offered its guest no way to reset the\nsystem.\
    \  An RTEMS application ended through a branch to an unaligned\naddress, so QEMU\
    \ aborted with a core dump.\n\nMap a timebase watchdog at 0x83a00000.  Use an\
    \ interval of 2^20 cycles,\nso that a reset completes within about 35ms at 62MHz.\n\
    \nAssisted-by: Claude:claude-opus-5-5 claude-code\nSigned-off-by: Sebastian Huber\
    \ <sebastian.huber@embedded-brains.de>\n---\n hw/microblaze/Kconfig          \
    \          |  1 +\n hw/microblaze/petalogix_s3adsp1800_mmu.c | 12 ++++++++++++\n\
    \ 2 files changed, 13 insertions(+)\n\ndiff --git a/hw/microblaze/Kconfig b/hw/microblaze/Kconfig\n\
    index 72d8072f7..5f27b4c21 100644\n--- a/hw/microblaze/Kconfig\n+++ b/hw/microblaze/Kconfig\n\
    @@ -6,6 +6,7 @@ config PETALOGIX_S3ADSP1800\n     select XILINX\n     select XILINX_AXI\n\
    \     select XILINX_ETHLITE\n+    select XILINX_TIMEBASE_WDT\n     select UNIMP\n\
    \ \n config PETALOGIX_ML605\ndiff --git a/hw/microblaze/petalogix_s3adsp1800_mmu.c\
    \ b/hw/microblaze/petalogix_s3adsp1800_mmu.c\nindex c5f643190..b079b2590 100644\n\
    --- a/hw/microblaze/petalogix_s3adsp1800_mmu.c\n+++ b/hw/microblaze/petalogix_s3adsp1800_mmu.c\n\
    @@ -49,6 +49,7 @@\n #define GPIO_BASEADDR 0x81400000\n #define INTC_BASEADDR 0x81800000\n\
    \ #define TIMER_BASEADDR 0x83c00000\n+#define WDT_BASEADDR 0x83a00000\n #define\
    \ UARTLITE_BASEADDR 0x84000000\n #define ETHLITE_BASEADDR 0x81000000\n \n@@ -144,6\
    \ +145,17 @@ petalogix_s3adsp1800_init(MachineState *machine)\n     sysbus_mmio_map(SYS_BUS_DEVICE(dev),\
    \ 0, ETHLITE_BASEADDR);\n     sysbus_connect_irq(SYS_BUS_DEVICE(dev), 0, irq[ETHLITE_IRQ]);\n\
    \ \n+    /*\n+     * The second expiry of the watchdog resets the system.  The\
    \ interval of\n+     * 2^20 cycles is about 17ms at 62MHz.\n+     */\n+    dev\
    \ = qdev_new(\"xlnx.xps-timebase-wdt\");\n+    qdev_prop_set_enum(dev, \"endianness\"\
    , endianness);\n+    qdev_prop_set_uint32(dev, \"clock-frequency\", 62 * 1000000);\n\
    +    qdev_prop_set_uint8(dev, \"wdt-interval\", 20);\n+    sysbus_realize_and_unref(SYS_BUS_DEVICE(dev),\
    \ &error_fatal);\n+    sysbus_mmio_map(SYS_BUS_DEVICE(dev), 0, WDT_BASEADDR);\n\
    +\n     create_unimplemented_device(\"xps_gpio\", GPIO_BASEADDR, 0x10000);\n \n\
    \     microblaze_load_kernel(cpu, endianness == ENDIAN_MODE_LITTLE, ddr_base,\n\
    -- \n2.53.0\n\n"

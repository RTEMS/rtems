  patch: "From 932c652973b53a5c67eb64dc8f60e0491fe649a6 Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Fri, 21 Aug\
    \ 2026 14:54:40 +0200\nSubject: [PATCH 2/2] hw/timer/xilinx_timer: Reload at the\
    \ expiry\n\nThe callback of a timer with the auto reload and hold bit set restarted\n\
    the count.  It restarted it at the moment the callback ran, so every\nperiod gained\
    \ the latency of the callback and the period moved with the\nload of the host.\n\
    \nRun the ptimer in the periodic mode, so that it reloads at the expiry.\nA write\
    \ of the load register while the count runs sets the limit for\nthe next reload,\
    \ which keeps the load value live.\n\nThe clock tick of the petalogix-s3adsp1800\
    \ machine measures 62000.01\ncounts of a second timer against a programmed 62000\
    \ with -icount, and\n61929 to 62036 counts in host time.  The values before this\
    \ series are\n62327 and 63535 to 64083.\n\nAssisted-by: Claude:claude-opus-5 claude-code\n\
    Signed-off-by: Sebastian Huber <sebastian.huber@embedded-brains.de>\n---\n hw/timer/xilinx_timer.c\
    \ | 36 ++++++++++++++++++++++++++++--------\n 1 file changed, 28 insertions(+),\
    \ 8 deletions(-)\n\ndiff --git a/hw/timer/xilinx_timer.c b/hw/timer/xilinx_timer.c\n\
    index dff439c623..7120c339ec 100644\n--- a/hw/timer/xilinx_timer.c\n+++ b/hw/timer/xilinx_timer.c\n\
    @@ -139,6 +139,14 @@ timer_read(void *opaque, hwaddr addr, unsigned int size)\n\
    \     return r;\n }\n \n+static uint64_t timer_limit(struct xlx_timer *xt)\n+{\n\
    +    if (xt->regs[R_TCSR] & TCSR_UDT)\n+        return xt->regs[R_TLR];\n+   \
    \ else\n+        return ~0 - xt->regs[R_TLR];\n+}\n+\n /* Must be called inside\
    \ ptimer transaction block */\n static void timer_enable(struct xlx_timer *xt)\n\
    \ {\n@@ -149,12 +157,14 @@ static void timer_enable(struct xlx_timer *xt)\n \n\
    \     ptimer_stop(xt->ptimer);\n \n-    if (xt->regs[R_TCSR] & TCSR_UDT)\n-  \
    \      count = xt->regs[R_TLR];\n-    else\n-        count = ~0 - xt->regs[R_TLR];\n\
    +    count = timer_limit(xt);\n     ptimer_set_limit(xt->ptimer, count, 1);\n\
    -    ptimer_run(xt->ptimer, 1);\n+    /*\n+     * The auto reload and hold bit\
    \ makes the count periodic.  Let the ptimer\n+     * carry the period, so that\
    \ it reloads at the expiry rather than when the\n+     * callback runs.\n+   \
    \  */\n+    ptimer_run(xt->ptimer, !(xt->regs[R_TCSR] & TCSR_ARHT));\n }\n \n\
    \ static void\n@@ -195,6 +205,19 @@ timer_write(void *opaque, hwaddr addr,\n \
    \            break;\n         }\n  \n+        case R_TLR:\n+            xt->regs[addr]\
    \ = value;\n+            /*\n+             * A running periodic count takes the\
    \ new load value at its next\n+             * reload.\n+             */\n+   \
    \         if (xt->regs[R_TCSR] & TCSR_ENT) {\n+                ptimer_transaction_begin(xt->ptimer);\n\
    +                ptimer_set_limit(xt->ptimer, timer_limit(xt), 0);\n+        \
    \        ptimer_transaction_commit(xt->ptimer);\n+            }\n+           \
    \ break;\n+\n         default:\n             if (addr < ARRAY_SIZE(xt->regs))\n\
    \                 xt->regs[addr] = value;\n@@ -226,9 +249,6 @@ static void timer_hit(void\
    \ *opaque)\n     XpsTimerState *t = xt->parent;\n     D(fprintf(stderr, \"%s %d\\\
    n\", __func__, xt->nr));\n     xt->regs[R_TCSR] |= TCSR_TINT;\n-\n-    if (xt->regs[R_TCSR]\
    \ & TCSR_ARHT)\n-        timer_enable(xt);\n     timer_update_irq(t);\n }\n \n\
    -- \n2.53.0\n\n"

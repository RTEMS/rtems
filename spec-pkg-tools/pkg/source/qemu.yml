  patch: "From ee58daa8fc7c52baa578fc54a1aa6b4dbfd6b8ad Mon Sep 17 00:00:00 2001\n\
    From: Sebastian Huber <sebastian.huber@embedded-brains.de>\nDate: Fri, 11 Sep\
    \ 2026 03:28:13 +0200\nSubject: [PATCH] target/mips/tcg: Gate rdhwr on Config3.ULRI\n\
    \nThe user local register of a MIPS processor exists where Config3.ULRI\nis set.\
    \  gen_rdhwr() read CP0_UserLocal for hardware register 29\nwhatever that bit\
    \ held.  A processor which implements no such register\nreturned a value nobody\
    \ wrote.  A 24Kf leaves ULRI clear, so an\noperating system which supplies the\
    \ thread pointer through the\nreserved instruction exception never saw that exception.\n\
    \nGate the read on the bit.  A processor without the register then takes\nthe\
    \ reserved instruction exception.  The operating system emulates the\ninstruction\
    \ and supplies the value.\n\nRTEMS on the malta machine reads the thread pointer\
    \ this way.\n\nAssisted-by: Claude:claude-opus-5 claude-code\nSigned-off-by: Sebastian\
    \ Huber <sebastian.huber@embedded-brains.de>\n---\n target/mips/tcg/translate.c\
    \ | 9 +++++++--\n 1 file changed, 7 insertions(+), 2 deletions(-)\n\ndiff --git\
    \ a/target/mips/tcg/translate.c b/target/mips/tcg/translate.c\nindex e3467d1525..37f562df0d\
    \ 100644\n--- a/target/mips/tcg/translate.c\n+++ b/target/mips/tcg/translate.c\n\
    @@ -10915,8 +10915,13 @@ void gen_rdhwr(DisasContext *ctx, int rt, int rd, int\
    \ sel)\n         gen_store_gpr(t0, rt);\n         break;\n #else\n-        if\
    \ ((ctx->hflags & MIPS_HFLAG_CP0) ||\n-            (ctx->hflags & MIPS_HFLAG_HWRENA_ULR))\
    \ {\n+        /*\n+         * The user local register exists where Config3.ULRI\
    \ says so.  A\n+         * processor without it takes a reserved instruction exception,\
    \ which\n+         * lets an operating system supply the value.\n+         */\n\
    +        if (ctx->ulri && ((ctx->hflags & MIPS_HFLAG_CP0) ||\n+              \
    \            (ctx->hflags & MIPS_HFLAG_HWRENA_ULR))) {\n             tcg_gen_ld_tl(t0,\
    \ tcg_env,\n                           offsetof(CPUMIPSState, active_tc.CP0_UserLocal));\n\
    \             gen_store_gpr(t0, rt);\n-- \n2.53.0\n\n"

name: Fetch tools
description: |
  Fetches the tools of the tools package version with the tag into the
  `tools` directory.  The tools artifact of the run is the fallback for a tag
  without a version.  The job requires the `packages: read` permission.
inputs:
  package:
    description: |
      Defines the tools package without the tag.
    required: true
  tag:
    description: |
      Defines the tag of the tools package.
    required: true
  arch:
    description: |
      Defines the architecture which names the tools artifact.
    required: true
runs:
  using: composite
  steps:
    - name: Set up ORAS
      uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      with:
        version: 1.3.4
    - name: Fetch the tools file
      # A version holds the source as well.  The job needs the tools file
      # only.
      id: fetch
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        TAG: ${{ inputs.tag }}
        TOKEN: ${{ github.token }}
      run: |
        mkdir -p tools-download
        oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin \
          <<<"${TOKEN}"
        if manifest="$(oras manifest fetch "${PACKAGE}:${TAG}")"; then
          digest="$(jq -r '.layers[] | select(.annotations["org.opencontainers.image.title"] == "tools.tar.zst") | .digest' <<<"${manifest}")"
          oras blob fetch --output tools-download/tools.tar.zst \
            "${PACKAGE}@${digest}"
          echo "found=true" >>"${GITHUB_OUTPUT}"
        else
          echo "found=false" >>"${GITHUB_OUTPUT}"
        fi
    - name: Download the tools artifact
      if: ${{ steps.fetch.outputs.found != 'true' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: tools-${{ inputs.arch }}
        path: tools-download
    - name: Unpack the tools
      shell: bash
      run: |
        zstd --decompress --stdout tools-download/tools.tar.zst | tar -xf -
        rm -r tools-download

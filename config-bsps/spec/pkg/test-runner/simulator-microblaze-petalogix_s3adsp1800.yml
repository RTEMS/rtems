SPDX-License-Identifier: CC-BY-SA-4.0 OR BSD-2-Clause
command:
- ${../deployment/qemu:/directory}/bin/qemu-system-microblaze
- -no-reboot
- -nographic
- -net
- none
- -serial
- mon:stdio
- -machine
- petalogix-s3adsp1800,endianness=little
- -icount
- shift=4
- -cpu
- microblaze-cpu
- -global
- microblaze-cpu.ill-opcode-exception=true
- -global
- microblaze-cpu.opcode-0x0-illegal=true
- -m
- 256M
- -kernel
- ${.:/test-executable}
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
default-timeout-in-seconds: 180.0
description: |
  Run the tests of the petalogix_s3adsp1800 BSP on Qemu.  The console is
  the first serial device.  The kcu105_qemu BSP needs the machine
  microblaze-fdt-plnx of the Xilinx fork, so this BSP variant is the one
  which runs on upstream Qemu.  The machine builds the core without the
  illegal instruction exception unit.  Two CPU properties add the unit and
  make the opcode 0x00000000 illegal, so _CPU_Instruction_illegal() raises
  a hardware exception.
discard-patterns: []
do-not-run: []
enabled-by: microblaze/petalogix_s3adsp1800
links:
- role: proxy-member
  uid: simulator
- role: weak-package-build-dependency
  uid: ../deployment/qemu
max-process-count: 1
max-retry-count-per-executable: 1
min-timeout-in-seconds: 20.0
name: Qemu [petalogix-s3adsp1800,endianness=little]
params: {}
pkg-type: test-runner
test-runner-type: subprocess
timeout-scaler: 2.0
type: pkg

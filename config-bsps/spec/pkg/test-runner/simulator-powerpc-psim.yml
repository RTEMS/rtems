SPDX-License-Identifier: CC-BY-SA-4.0 OR BSD-2-Clause
command:
- ${../deployment/gdb-sim:/directory}/bin/powerpc-rtems7-run
- -f
- ${../deployment/psim-device-tree:/directory}/psim-device-tree
- ${.:/test-executable}
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
default-timeout-in-seconds: 180.0
description: |
  Run the tests of the psim BSP on the PowerPC simulator of the
  ${/glossary/gdb:/term}.  The device tree describes the simulated board.
discard-patterns: []
do-not-run: []
enabled-by: powerpc/psim
links:
- role: proxy-member
  uid: simulator
- role: weak-package-build-dependency
  uid: ../deployment/gdb-sim
- role: weak-package-build-dependency
  uid: ../deployment/psim-device-tree
max-process-count: 1
max-retry-count-per-executable: 1
min-timeout-in-seconds: 20.0
name: PowerPC simulator of the GDB
params: {}
pkg-type: test-runner
test-runner-type: subprocess
timeout-scaler: 2.0
type: pkg

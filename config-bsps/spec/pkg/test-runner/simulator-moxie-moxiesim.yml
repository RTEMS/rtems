SPDX-License-Identifier: CC-BY-SA-4.0 OR BSD-2-Clause
command:
- ${../deployment/gdb-sim:/directory}/bin/moxie-rtems7-run
- ${.:/test-executable}
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
default-timeout-in-seconds: 180.0
description: |
  Run the tests of the moxiesim BSP on the standalone moxie simulator of
  the ${/glossary/gdb:/term}.
discard-patterns: []
do-not-run: []
enabled-by: moxie/moxiesim
links:
- role: proxy-member
  uid: simulator
- role: weak-package-build-dependency
  uid: ../deployment/gdb-sim
max-process-count: 1
max-retry-count-per-executable: 1
min-timeout-in-seconds: 20.0
name: GDB simulator [moxie-rtems7-run]
params: {}
pkg-type: test-runner
test-runner-type: subprocess
timeout-scaler: 2.0
type: pkg

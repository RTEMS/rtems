SPDX-License-Identifier: CC-BY-SA-4.0 OR BSD-2-Clause
command:
- ${../deployment/qemu:/directory}/bin/qemu-system-aarch64
- -no-reboot
- -nographic
- -net
- none
- -serial
- mon:stdio
- -machine
- virt,gic-version=3
- -icount
- shift=4
- -cpu
- cortex-a53
- -m
- '4096'
- -kernel
- ${.:/test-executable}
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
default-timeout-in-seconds: 180.0
description: |
  Run the tests of the a53_lp64_qemu BSP on Qemu.  The console is the
  first serial device.
discard-patterns: []
do-not-run: []
enabled-by: aarch64/a53_lp64_qemu
links:
- role: proxy-member
  uid: simulator
- role: weak-package-build-dependency
  uid: ../deployment/qemu
max-process-count: 1
max-retry-count-per-executable: 1
min-timeout-in-seconds: 20.0
name: Qemu [virt,gic-version=3]
params: {}
pkg-type: test-runner
test-runner-type: subprocess
timeout-scaler: 2.0
type: pkg

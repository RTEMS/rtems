SPDX-License-Identifier: CC-BY-SA-4.0 OR BSD-2-Clause
command:
- ${../deployment/gdb-sim:/directory}/bin/mipstx39-rtems7-run
- --board=jmr3904
- ${.:/test-executable}
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
default-timeout-in-seconds: 180.0
description: |
  Run the tests of the jmr3904 BSP on the standalone MIPS simulator of
  the ${/glossary/gdb:/term}.  The board option selects the TX3904
  peripherals.
discard-patterns: []
do-not-run: []
enabled-by: mips/jmr3904
links:
- role: proxy-member
  uid: simulator
- role: weak-package-build-dependency
  uid: ../deployment/gdb-sim
max-process-count: 1
max-retry-count-per-executable: 1
min-timeout-in-seconds: 20.0
name: GDB simulator [mipstx39-rtems7-run --board=jmr3904]
params: {}
pkg-type: test-runner
test-runner-type: subprocess
timeout-scaler: 2.0
type: pkg

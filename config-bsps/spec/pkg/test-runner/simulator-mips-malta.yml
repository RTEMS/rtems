SPDX-License-Identifier: CC-BY-SA-4.0 OR BSD-2-Clause
command:
- ${../deployment/qemu:/directory}/bin/qemu-system-mips
- -no-reboot
- -nographic
- -net
- none
- -machine
- malta
- -cpu
- 24Kf
- -icount
- shift=4
- -m
- 256M
- -kernel
- ${.:/test-executable}
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
default-timeout-in-seconds: 300.0
description: |
  Run the tests of the malta BSP on Qemu.  The linker command file
  reserves memory up to 0x88400000, which is 132 MiB above the base, so
  the machine needs more than the 128 MiB default.  The thread-local
  storage tests need a Qemu which gates the rdhwr read of the user local
  register on Config3.ULRI.  A 24Kf leaves that bit clear, and without
  the gate the instruction returns a register nobody wrote.
discard-patterns: []
do-not-run: []
enabled-by: mips/malta
links:
- role: proxy-member
  uid: simulator
- role: weak-package-build-dependency
  uid: ../deployment/qemu
max-process-count: 1
max-retry-count-per-executable: 1
min-timeout-in-seconds: 20.0
name: Qemu [malta 24Kf]
params: {}
pkg-type: test-runner
test-runner-type: subprocess
timeout-scaler: 2.0
type: pkg

SPDX-License-Identifier: CC-BY-SA-4.0 OR BSD-2-Clause
command:
- ${../deployment/sis:/directory}/bin/sis
- -gr765
- -dumbio
- -r
- enabled-by: RTEMS_SMP
  value:
  - -m
  - '4'
- ${.:/test-executable}
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
default-timeout-in-seconds: 180.0
description: |
  Run the tests of the gr765 BSP on the ${/glossary/sis:/term}.  The GR765
  mode of SIS sets the extended interrupt line of the IRQ(A)MP to line 12.
  An SMP test runs on four processors, since the validation test suites
  configure at most five processors and leave the fifth without a scheduler.
discard-patterns: []
do-not-run: []
enabled-by: sparc/gr765
links:
- role: proxy-member
  uid: simulator
- role: weak-package-build-dependency
  uid: ../deployment/sis
max-process-count: 1
max-retry-count-per-executable: 1
min-timeout-in-seconds: 20.0
name: SPARC/RISCV Instruction Simulator [-gr765]
params: {}
pkg-type: test-runner
test-runner-type: subprocess
timeout-scaler: 2.0
type: pkg

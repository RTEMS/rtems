SPDX-License-Identifier: CC-BY-SA-4.0 OR BSD-2-Clause
command:
- ${../deployment/qemu:/directory}/bin/qemu-system-x86_64
- -no-reboot
- -nographic
- -net
- none
- -serial
- mon:stdio
- -machine
- q35
- -icount
- shift=4
- enabled-by: RTEMS_SMP
  value:
  - -smp
  - '4'
- -cpu
- qemu64
- -m
- 512M
- -kernel
- ${.:/test-executable}
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
default-timeout-in-seconds: 180.0
description: |
  Run the tests of the amd64 BSP on Qemu.  The BSP takes its time from
  the time stamp counter and its clock tick from the local APIC timer.
  Qemu advances both in host time, so what the tests measure depends on
  the load of the host and a test which waits for a tick while another
  simulator runs overruns.  The virtual clock comes from the instruction
  count, which removes the dependency.
discard-patterns: []
do-not-run: []
enabled-by: x86_64/amd64
links:
- role: proxy-member
  uid: simulator
- role: weak-package-build-dependency
  uid: ../deployment/qemu
max-process-count: 1
max-retry-count-per-executable: 1
min-timeout-in-seconds: 20.0
name: Qemu [q35]
params: {}
pkg-type: test-runner
test-runner-type: subprocess
timeout-scaler: 2.0
type: pkg
